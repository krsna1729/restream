name: CI

on:
  push:
    branches:
      - master
      - feat/rust-backend-rewrite-v2
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Rust format check
        run: cargo fmt --all --check
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript compile check
        run: npx tsc -p tsconfig.json --noEmit

  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - name: Rust clippy (strict for lib)
        run: scripts/build/resource-limit.sh cargo clippy --lib -- -D warnings
      - name: Rust clippy (strict for all targets)
        run: scripts/build/resource-limit.sh cargo clippy --workspace --all-targets -- -D warnings

  architecture-guardrails:
    name: Architecture guardrails
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Run source audit
        run: ./scripts/check/source-audit.sh
      - name: Upload source audit inventory
        uses: actions/upload-artifact@v7
        with:
          name: source-audit
          path: target/source-audit.json

  api-contract:
    name: API contract gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: live
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run API contract gate
        run: ./scripts/check/api-contract.sh

  frontend:
    name: Frontend source and browser-DOM gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run frontend source tests
        run: npm run test:frontend
      - name: Install Chromium for browser-DOM tests
        run: npx playwright install --with-deps chromium
      - name: Run browser-DOM tests
        run: npm run test:frontend:browser-dom

  frontend-e2e:
    name: Frontend full-app integration
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: browser
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium for full-app tests
        run: npx playwright install --with-deps chromium
      - name: Run isolated app/browser integration
        run: npm run test:e2e

  concurrency-contract:
    name: Concurrency contract gate
    runs-on: ubuntu-24.04
    needs: api-contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: live
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - name: Run concurrency contract gate
        run: bash ./scripts/check/concurrency/contract.sh

  test:
    name: Unit & integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - name: Rust test hygiene gate
        run: ./scripts/check/test-hygiene.sh
      - name: Fixture discipline gate
        run: ./scripts/check/fixture-discipline.sh

  sbom-sync:
    name: SBOM sync check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - name: Rebuild committed SBOM
        run: scripts/build/resource-limit.sh ./scripts/build/app-native.sh
      - name: Verify committed SBOM is up to date
        run: git diff --exit-code -- sbom/restream-runtime.cdx.json

  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: scripts/build/resource-limit.sh cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Coverage summary
        run: |
          echo "=== Coverage summary ==="
          cargo llvm-cov report --summary-only 2>/dev/null || true

  integration:
    name: Integration test (ramp + mixed-scale)
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: live
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - name: Build canonical bench harness binaries
        run: ./scripts/build/bench-harness.sh
      - name: Run integration suite
        env:
          BENCH_BUILD: never
        run: |
          # The live dependency profile already installs FFmpeg and delegates
          # pinned MediaMTX setup to bootstrap-runtime.sh. Keep execution on the
          # same bench builder/runner developers use so CI cannot silently test
          # release-profile measurements or drift into a third setup path.
          scripts/harness/run.sh suite -- \
            --only-modes ramp-family,mixed.live.rtmp.h264.a1.bf2,mixed.live.srt.h264.a1.bf2,mixed.live.srt.h265.a1.bf2,mixed.live.srt.h264.a2.bf2,mixed.live.srt.h265.a2.bf2 \
            --no-netns \
            --continue-on-fail
      - name: Run mixed fast-breadth governor
        env:
          N_PER_GROUP: "1"
          BENCH_BUILD: never
        run: scripts/harness/run.sh mixed.fast-breadth -- --no-netns
      - name: Run internal backend rollout smoke
        env:
          BENCH_BUILD: never
          INTERNAL_BACKEND_SMOKE_CONTINUE_ON_FAIL: "1"
          # Hosted runners cannot preserve the SRT sysctls inside the optional
          # user namespace; keep all live slices on the same host-network
          # fallback instead of letting this nested runner regress separately.
          TEST_HARNESS_USE_HOST_NET: "1"
        run: ./scripts/harness/rollouts/internal-backend-smoke.sh
      - name: Upload internal backend smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: internal-backend-smoke
          path: .local/artifacts/internal-backend-smoke/
          if-no-files-found: ignore
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-artifacts
          path: .local/artifacts/
          if-no-files-found: ignore

  playwright:
    name: HLS player E2E
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore or build native prefix
        uses: ./.github/actions/native-prefix
      - name: Restore Rust build cache
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install chromium
      - name: Build release binary
        run: scripts/build/resource-limit.sh cargo build --release
      - name: Start app
        run: ./target/release/restream &
      - name: Wait for app
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3030/healthz; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready" >&2
          exit 1
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
