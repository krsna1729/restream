name: PR and branch CI

on:
  push:
    branches:
      - master
      - feat/rust-backend-rewrite-v2
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RESTREAM_CI_HARNESS_IMAGE: ghcr.io/${{ github.repository }}-ci-harness-runtime:ubuntu24

jobs:
  format:
    name: Source formatting and TS types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check TypeScript types
        run: npx tsc -p tsconfig.json --noEmit

  lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install Rust lint dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore native prefix for Rust lint
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for lint
        uses: ./.github/actions/rust-cache
      - name: Run clippy for library
        run: scripts/build/resource-limit.sh cargo clippy --lib -- -D warnings
      - name: Run clippy for all targets
        run: scripts/build/resource-limit.sh cargo clippy --workspace --all-targets -- -D warnings

  architecture-guardrails:
    name: Source architecture audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check source size and generated-file boundaries
        run: ./scripts/check/source-audit.sh
      - name: Upload source audit report
        uses: actions/upload-artifact@v7
        with:
          name: source-audit
          path: target/source-audit.json

  api-contract:
    name: API contract smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install API contract dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: live
      - name: Restore native prefix for API contract
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for API contract
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run API contract smoke
        run: ./scripts/check/api-contract.sh

  frontend:
    name: Frontend unit and browser DOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run frontend unit tests
        run: npm run test:frontend
      - name: Install Chromium for DOM tests
        run: npx playwright install --with-deps chromium
      - name: Run browser DOM tests
        run: npm run test:frontend:browser-dom

  frontend-e2e:
    name: Frontend app E2E
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install frontend app E2E dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: browser
      - name: Restore native prefix for frontend app E2E
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for frontend app E2E
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium for app E2E
        run: npx playwright install --with-deps chromium
      - name: Run isolated app E2E
        run: npm run test:e2e

  concurrency-contract:
    name: Concurrency lifecycle proof
    runs-on: ubuntu-24.04
    needs: api-contract
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install concurrency proof dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: live
      - name: Restore native prefix for concurrency proof
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for concurrency proof
        uses: ./.github/actions/rust-cache
      - name: Run concurrency lifecycle proof
        env:
          # Hosted runners cannot preserve the optional private network
          # namespace setup; keep the live fault slices on the same host-network
          # fallback used by the other hosted harness jobs.
          CONCURRENCY_HARNESS_ARGS: "--no-netns"
        run: bash ./scripts/check/concurrency/contract.sh

  test:
    name: Rust unit hygiene and fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install Rust test dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore native prefix for Rust tests
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for Rust tests
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build frontend assets for Rust tests
        run: npm run build:frontend
      - name: Check Rust test hygiene
        run: ./scripts/check/test-hygiene.sh
      - name: Check fixture discipline
        run: ./scripts/check/fixture-discipline.sh

  coverage:
    name: Workspace coverage report
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - name: Install coverage dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: base
      - name: Restore native prefix for coverage
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for coverage
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build frontend assets for coverage
        run: npm run build:frontend
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate workspace coverage
        run: scripts/build/resource-limit.sh cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Upload workspace coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Print coverage summary
        run: |
          echo "=== Coverage summary ==="
          cargo llvm-cov report --summary-only 2>/dev/null || true

  integration-build:
    name: PR live-smoke harness build
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install PR live-smoke build dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: build
      - name: Restore native prefix for PR live-smoke build
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for PR live-smoke build
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build frontend assets for harness binaries
        run: npm run build:frontend
      - name: Build bench-profile harness binaries
        run: ./scripts/build/bench-harness.sh
      - name: Stage PR live-smoke harness artifact
        run: |
          mkdir -p .local/ci-harness-bin
          cp target/bench/restream target/bench/test_harness .local/ci-harness-bin/
      - uses: actions/upload-artifact@v7
        with:
          name: ci-harness-bin-${{ github.sha }}
          path: .local/ci-harness-bin/*
          retention-days: 1

  integration-shards:
    name: PR live-smoke shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: integration-build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        # PR CI runs a correctness slice: cheap harness smoke, RTMP ingest,
        # SRT/H.264 anchor coverage, HEVC bridge coverage, and HEVC
        # multi-audio routing. Release dry-runs own the exhaustive file-ingest,
        # bitrate/resource measurement, crypto, branch, ramp, and fault matrix.
        shard:
          - smoke
          - mixed.live.rtmp.h264.a1
          - mixed.live.srt.h264.a1
          - mixed.live.srt.h265.a1
          - mixed.live.srt.h265.a2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-harness-bin-${{ github.sha }}
          path: .local/ci-harness-bin
      - name: Install PR live-smoke harness binaries
        run: |
          mkdir -p target/bench
          cp .local/ci-harness-bin/restream .local/ci-harness-bin/test_harness target/bench/
          chmod 0755 target/bench/restream target/bench/test_harness
      - name: Run PR live-smoke shard
        env:
          BENCH_BUILD: never
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/run-harness-shard-in-runtime.sh "${{ matrix.shard }}"
      - name: Upload PR live-smoke artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: integration-${{ matrix.shard }}-artifacts
          path: .local/artifacts/
          if-no-files-found: ignore

  internal-backend-smoke:
    name: Internal media backend smoke
    runs-on: ubuntu-24.04
    needs: integration-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-harness-bin-${{ github.sha }}
          path: .local/ci-harness-bin
      - name: Install internal-backend harness binaries
        run: |
          mkdir -p target/bench
          cp .local/ci-harness-bin/restream .local/ci-harness-bin/test_harness target/bench/
          chmod 0755 target/bench/restream target/bench/test_harness
      - name: Run internal media backend rollout smoke
        env:
          BENCH_BUILD: never
          GH_TOKEN: ${{ github.token }}
          INTERNAL_BACKEND_SMOKE_CONTINUE_ON_FAIL: "1"
          # Hosted runners cannot preserve the SRT sysctls inside the optional
          # user namespace; keep all live slices on the same host-network
          # fallback instead of letting this nested runner regress separately.
          TEST_HARNESS_USE_HOST_NET: "1"
        run: scripts/ci/run-in-harness-runtime.sh scripts/harness/rollouts/internal-backend-smoke.sh
      - name: Upload internal media backend artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: internal-backend-smoke
          path: .local/artifacts/internal-backend-smoke/
          if-no-files-found: ignore

  playwright:
    name: HLS browser playback E2E
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install HLS E2E dependencies
        uses: ./.github/actions/system-deps
        with:
          profile: browser
      - name: Restore native prefix for HLS E2E
        uses: ./.github/actions/native-prefix
      - name: Restore Rust cache for HLS E2E
        uses: ./.github/actions/rust-cache
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install Chromium for HLS E2E
        run: npx playwright install chromium
      - name: Build frontend assets for HLS E2E
        run: npm run build:frontend
      - name: Build app binary for HLS E2E
        run: scripts/build/resource-limit.sh cargo build --release
      - name: Seed HLS E2E media library
        run: |
          mkdir -p .local/e2e/media .local/e2e/logs
          cp test/fixtures/media-library/colorbar-timer-2v16a.mp4 .local/e2e/media/
      - name: Start app for HLS E2E
        env:
          RESTREAM_DB_PATH: .local/e2e/restream.db
          RESTREAM_MEDIA_DIR: .local/e2e/media
          RESTREAM_LOG_DIR: .local/e2e/logs
          RESTREAM_INITIAL_ADMIN_PASSWORD: admin
        run: ./target/release/restream &
      - name: Wait for HLS E2E app
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3030/healthz; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready" >&2
          exit 1
      - name: Run HLS Playwright tests
        run: npx playwright test
      - name: Upload HLS E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: .local/test-results/
          if-no-files-found: ignore
