name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RESTREAM_CI_HARNESS_IMAGE: ghcr.io/${{ github.repository }}-ci-harness-runtime:ubuntu24

jobs:
  format:
    name: Source formatting and TS types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          rust_components: rustfmt
          node_version: '22'
          npm_ci: 'true'
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check TypeScript types
        run: npx tsc -p tsconfig.json --noEmit
      - name: Check agent worktree dependency readiness
        run: cargo test -p xtask worktree::tests

  lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          rust_components: clippy
          system_deps_profile: base
          rust_cache: 'true'
      - name: Run clippy for library
        run: cargo clippy --lib -- -D warnings
      - name: Run clippy for all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run clippy for MCP-enabled release surface
        run: |
          cargo clippy \
            --workspace \
            --all-targets \
            --features mcp-server,mcp-http-backend \
            -- -D warnings
      - name: Prove MCP feature matrix
        run: |
          # Select the product package explicitly: workspace members such as
          # the harness otherwise re-enable its dependency's default features.
          # Lower-layer isolation: agent-plane/agent-execution stay disabled.
          cargo check -p restream \
            --lib --no-default-features --features mcp-core
          cargo check -p restream \
            --lib --no-default-features --features mcp-server
          cargo check -p restream \
            --bin restream-mcp --no-default-features \
            --features mcp-server,mcp-http-backend
          # Compatibility combo: mcp-embedded = mcp-core + agent-plane.
          # Must compile; must not invent an in-process MCP backend.
          cargo check -p restream \
            --lib --no-default-features --features mcp-embedded
          # Agent tool list (discovery, MCP catalog, dispatch) and agent output mutations.
          cargo test -p restream --lib --no-default-features \
            --features mcp-embedded,agent-execution -- agent_mcp agent_service
          # Require both compiled-out tests, not merely a passing test binary:
          # a feature-unified build must fail this proof instead of testing enabled routes.
          cargo xtask require-test-filters cargo test -p restream --no-default-features --test api -- \
            agent::agent_plane_returns_404_when_feature_is_compiled_out \
            agent::agent_context_returns_404_when_feature_is_compiled_out
          cargo clippy -p restream --lib --test api --no-default-features -- -D warnings
          cargo test -p restream --no-default-features --test api -- agent::

  architecture-guardrails:
    name: Source architecture audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
      - name: Check source size and generated-file boundaries
        run: cargo xtask source-audit
      - name: Check Markdown documentation
        run: cargo xtask docs-audit
      - name: Check the dashboard is built from its primitives
        run: cargo xtask frontend-style

  docker-runtime-smoke:
    name: Docker runtime source-build smoke (targeted)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether Docker runtime smoke is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$base" --depth=1 || true
          # `distribution/` covers the shipped seccomp profile and its deployment
          # documentation. Extracted restream crates and the test harness also
          # qualify, alongside RTMP/RTMPS and SRT transport sources: they can
          # change the real media container proof and its runtime contract.
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -Eq '^(Dockerfile|crates/xtask/src/(release|container|qualify)(\.rs|/.*)|distribution/|tests/seccomp_profile\.rs|crates/restream-[^/]+/.*|crates/test_harness/.*|src/media/rtmp[^/]*\.rs|src/media/rtmp/.*|src/media/srt[^/]*\.rs|src/media/srt/.*|src/media/egress/.*|\.github/workflows/release\.yml|\.github/workflows/ci-harness-runtime-image\.yml)$'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.scope.outputs.run == 'false' }}
        name: Runtime path unchanged; skip Docker smoke
        run: echo "Docker runtime source-build paths, including extracted crates and harness, unchanged; skipping smoke."
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Runtime path changed; continue Docker smoke
        run: echo "Docker runtime source-build path changed; continuing."
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          # `live` (not `build`): the SRT and RTMP(S) media proofs drive the live
          # harness, which needs FFmpeg and the harness host tools.
          system_deps_profile: live
          rust_cache: 'true'
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Build frontend assets for the harness binary
        run: npm run build:frontend
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Build the live harness used by the SRT and RTMP(S) media proofs
        run: cargo xtask build-bench
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: docker/setup-buildx-action@v4
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Build runtime image from Dockerfile
        run: cargo xtask release prepare-build-tree
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Smoke production image (health + SRT and RTMP-to-RTMPS media under shipped seccomp)
        env:
          RESTREAM_CONTAINER_IMAGE: restream:pr-runtime-smoke
          RESTREAM_DOCKER_GHA_CACHE: "1"
          RESTREAM_CONTAINER_SMOKE_REPORT: .local/artifacts/container-smoke/report.json
        run: cargo xtask container smoke --image "$RESTREAM_CONTAINER_IMAGE"
      - if: ${{ always() && steps.scope.outputs.run == 'true' }}
        name: Upload container smoke report
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-report
          # report.json (engine, default-profile and shipped-profile outcomes)
          # plus the container logs that back it; kept whether the smoke passed
          # or failed so a run is reviewable without scraping the build log.
          path: .local/artifacts/container-smoke/
          if-no-files-found: warn
          retention-days: 14

  api-contract:
    name: API contract smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: live
          rust_cache: 'true'
      - name: Run API contract smoke
        run: cargo xtask api-contract

  frontend:
    name: Frontend unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
      - name: Run frontend unit tests with coverage report
        run: npm run test:frontend:coverage

  frontend-e2e:
    name: Frontend app E2E
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: browser
          rust_cache: 'true'
      - name: Install Chromium and Firefox for app E2E
        run: npx playwright install --with-deps chromium firefox
      - name: Run isolated app E2E
        run: npm run test:e2e

  concurrency-fast:
    name: Concurrency fast proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          system_deps_profile: media
          rust_cache: 'true'
      - name: Run fast concurrency proof
        run: cargo xtask concurrency fast
      - name: Assert egress ready-queue cost shape (O(ready), not O(population))
        run: cargo test --test egress_scheduler_shape

  concurrency-contract:
    if: ${{ github.ref == 'refs/heads/master' }}
    name: Concurrency live lifecycle proof
    runs-on: ubuntu-24.04
    needs: api-contract
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          system_deps_profile: live
          rust_cache: 'true'
      - name: Run concurrency lifecycle proof
        env:
          # Hosted runners cannot preserve the optional private network
          # namespace setup; keep the live fault slices on the same host-network
          # fallback used by the other hosted harness jobs.
          CONCURRENCY_HARNESS_ARGS: "--no-netns"
        run: cargo xtask concurrency contract
      - name: Upload concurrency fault evidence
        if: ${{ always() && (failure() || cancelled()) }}
        uses: actions/upload-artifact@v7
        with:
          name: concurrency-lifecycle-${{ github.sha }}
          path: |
            .local/artifacts/concurrency-contract-logs/
            .local/artifacts/concurrency-contract/
            .local/artifacts/concurrency-fault-egress-retry/
            .local/artifacts/concurrency-fault-output-stall/
            .local/artifacts/concurrency-fault-srt-output-stall/
            .local/artifacts/concurrency-recovery/
          if-no-files-found: ignore
          retention-days: 7

  test:
    name: Rust unit hygiene and fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: media
          rust_cache: 'true'
      - name: Build frontend assets for Rust tests
        run: npm run build:frontend
      - name: Check Rust test hygiene
        run: cargo xtask test-hygiene
      - name: Check fixture discipline
        run: cargo xtask fixture-discipline

  coverage:
    name: Workspace coverage report
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          rust_components: llvm-tools-preview
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: media
          rust_cache: 'true'
      - name: Build frontend assets for coverage
        run: npm run build:frontend
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate workspace coverage
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Upload workspace coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Print coverage summary
        run: |
          echo "=== Coverage summary ==="
          cargo llvm-cov report --summary-only 2>/dev/null || true

  fuzz-smoke:
    name: Parser fuzz smoke
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether parser fuzzing is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fuzz targets reach src/media, the extracted restream crates, and
          # their harness/vendor dependencies. Shared manifests and toolchain
          # changes also qualify; master pushes always fuzz.
          if [[ "$EVENT_NAME" != "pull_request" || -z "$BASE_SHA" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" --depth=1 || true
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -Eq '^(src/media/|src/lib\.rs$|crates/restream-[^/]+/|crates/test_harness/|fuzz/|vendor/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.scope.outputs.run == 'false' }}
        name: Parser paths unchanged; skip fuzzing
        run: echo "No parser, extracted crate, harness, vendor, manifest or toolchain path changed; skipping fuzzing."
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: media
          rust_cache: 'true'
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Build frontend assets for the library
        run: npm run build:frontend
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Run every parser target for 30 s
        run: |
          cargo xtask fuzz seed-corpus
          cd fuzz
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -timeout=5
          done

  miri:
    name: Miri (pure modules Miri can execute)
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 45
    env:
      MIRI_FILTERS: >-
        media::egress::tls::ktls::tests::ancillary media::egress::leaf_arena
        media::egress::scheduler
    steps:
      - uses: actions/checkout@v7
      # No shared Rust cache: target/miri must not land in the cache every
      # other job restores.
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: media
          rust_cache: 'false'
          toolchain_cache: 'false'
      - name: Build frontend assets for the library
        run: npm run build:frontend
      - name: Install nightly with Miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - name: Every filter selects tests
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: ''
        run: cargo xtask require-test-filters cargo +nightly miri test -p restream --lib -- $MIRI_FILTERS
      - name: Run Miri over the selected modules
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: '8'
          # Nightly lints must not fail the gate without a code change.
          RUSTFLAGS: ''
        run: cargo +nightly miri test -p restream --lib -- $MIRI_FILTERS
      - name: Canonical codec bit reader selects tests
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: ''
        run: cargo xtask require-test-filters cargo +nightly miri test -p restream-core --lib -- codec::bits::tests
      - name: Run canonical codec bit reader under Miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          RUSTFLAGS: ''
        run: cargo +nightly miri test -p restream-core --lib codec::bits::tests

  kani:
    name: Kani (bounded proofs of egress primitives)
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 45
    env:
      # Every proof `cargo kani --lib` finds; a proof that stops compiling
      # (a cfg typo, a moved module) must fail the job, not vanish.
      KANI_PROOFS: '7'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: media
          rust_cache: 'false'
          toolchain_cache: 'false'
      - name: Build frontend assets for the library
        run: npm run build:frontend
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Run every Kani proof
        # No RUSTFLAGS override: Kani passes an empty one on as an argument.
        run: |
          cargo kani --lib -Z stubbing 2>&1 | tee kani.log
          grep -q "Complete - $KANI_PROOFS successfully verified harnesses, 0 failures, $KANI_PROOFS total" kani.log
          # Every cover reached (and some reported: a format change must not
          # pass silently): a proof whose interesting branch became
          # unreachable proves nothing about it.
          grep -E '^ \*\* [0-9]+ of [0-9]+ cover properties satisfied' kani.log \
            | awk '{ n++ } $2 != $4 { bad = 1 } END { exit bad || n == 0 }'

  asan:
    name: AddressSanitizer (FFI and syscall modules)
    runs-on: ubuntu-24.04
    needs: test
    timeout-minutes: 60
    env:
      ASAN_FILTERS: >-
        media::egress::tls media::egress::backends::compio_tcp
        media::external_transcoder media::timing media::rtmp::listener
        media::rtmp::tests media::tcp_stats runtime_info media::mpegts_allocation_tests
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: media
          rust_cache: 'false'
          toolchain_cache: 'false'
      - name: Build frontend assets for the library
        run: npm run build:frontend
      - name: Install nightly with rust-src
        run: rustup toolchain install nightly --profile minimal --component rust-src
      # Rust code is instrumented (build-std, explicit target so proc-macros
      # and build scripts are not). Leak detection stays off: it has never
      # been baselined, and process-lifetime statics would report as leaks.
      - name: The sanitizer flags are in effect
        run: |
          [[ $RUSTFLAGS == *sanitizer=address* ]] || { echo "RUSTFLAGS lost -Zsanitizer=address: $RUSTFLAGS"; exit 1; }
      # The guard itself runs from an unsanitized stable xtask build; only the
      # inner nightly test command it checks carries the sanitizer flags.
      - name: Every filter selects tests
        run: |
          RUSTFLAGS= RUSTDOCFLAGS= cargo build -q -p xtask
          target/debug/xtask require-test-filters cargo +nightly test -Zbuild-std \
            --target x86_64-unknown-linux-gnu -p restream --lib -- $ASAN_FILTERS
      - name: Run the FFI-heavy tests under ASan
        run: >
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu -p restream --lib --
          $ASAN_FILTERS
      - name: Every extracted suite selects tests
        run: |
          for package in restream-sync restream-mpegts; do
            target/debug/xtask require-test-filters cargo +nightly test -Zbuild-std \
              --target x86_64-unknown-linux-gnu -p "$package" --lib -- ''
          done
      - name: Run extracted synchronization and MPEG-TS tests under ASan
        run: >
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          -p restream-sync -p restream-mpegts --lib

  integration-build:
    name: Transport live-harness build
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: build
          rust_cache: 'true'
      - name: Build frontend assets for harness binaries
        run: npm run build:frontend
      - name: Build bench-profile harness binaries
        run: cargo xtask build-bench
      - name: Stage transport harness artifact
        run: |
          mkdir -p .local/ci-harness-bin
          cargo build --release -p xtask
          cp target/bench/restream target/bench/test_harness target/release/xtask .local/ci-harness-bin/
      - uses: actions/upload-artifact@v7
        with:
          name: ci-harness-bin-${{ github.sha }}
          path: .local/ci-harness-bin/*
          retention-days: 1

  integration-shards:
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/master' }}
    needs: integration-build
    uses: ./.github/workflows/_harness-runtime-shards.yml
    with:
      artifact_name: ci-harness-bin-${{ github.sha }}
      artifact_path: .local/ci-harness-bin
      install_dir: target/bench
      harness_bin: target/bench/test_harness
      restream_bin: target/bench/restream
      shard_name_prefix: PR transport smoke
      artifact_upload_prefix: integration
      artifact_upload_path: .local/artifacts/
      artifact_retention_days: 3
      upload_artifacts_mode: failure_or_cancelled
      timeout_minutes: 35
      max_parallel: 2
      shards_json: >-
        ["mixed.live.srt.h264.a1.bf0","mixed.live.rtmp.h264.a1.bf0","direct-play"]
    secrets:
      gh_token: ${{ github.token }}

  master-transport-shards:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: integration-build
    uses: ./.github/workflows/_harness-runtime-shards.yml
    with:
      artifact_name: ci-harness-bin-${{ github.sha }}
      artifact_path: .local/ci-harness-bin
      install_dir: target/bench
      harness_bin: target/bench/test_harness
      restream_bin: target/bench/restream
      shard_name_prefix: Master transport qualification
      artifact_upload_prefix: master-transport
      artifact_upload_path: .local/artifacts/
      artifact_retention_days: 7
      upload_artifacts_mode: failure_or_cancelled
      timeout_minutes: 70
      max_parallel: 5
      shards_json: >-
        ["mixed.live.srt.h264.a1.bf0","mixed.live.srt.h264.a1.bf2","mixed.live.srt.h264.a2.bf0","mixed.live.srt.h264.a2.bf2","mixed.live.srt.h265.a1.bf0","mixed.live.srt.h265.a1.bf2","mixed.live.srt.h265.a2.bf0","mixed.live.srt.h265.a2.bf2","mixed.live.rtmp.h264.a1.bf0","mixed.live.rtmp.h264.a1.bf2","srt-crypto-matrix","fault.resilience","direct-play"]
    secrets:
      gh_token: ${{ github.token }}

  moq-interop:
    # Both pinned moq.dev profiles: lite/browser coverage, then explicit
    # moqt-19 MSF/LOC egress and relay-forwarded ingest. MediaMTX remains
    # diagnostic-only until its dialect mismatch is resolved (Q-091).
    # Reuse integration-build's binaries and the same downloaded peers.
    name: MoQ interop
    runs-on: ubuntu-24.04
    needs: integration-build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether the MoQ interop check is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes to master and manual runs always qualify; a pull request
          # runs it for MoQ, shared core/sync dependencies, the egress fabric,
          # or this check.
          if [[ "$EVENT_NAME" != "pull_request" || -z "$BASE_SHA" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" --depth=1 || true
          if git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -Eq '^(src/.*moq.*|crates/restream-(moq|core|sync)/.*|crates/test_harness/.*moq.*|src/media/egress/.*|crates/xtask/src/fetch(\.rs|/.*)|test/e2e/moq/.*|\.github/workflows/ci\.yml)$'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.scope.outputs.run == 'false' }}
        name: MoQ paths unchanged; skip MoQ interop
        run: echo "No MoQ, shared core/sync, egress or MoQ-interop path changed; skipping."
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ci-harness-bin-${{ github.sha }}
          path: .local/ci-harness-bin
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Install harness binaries
        run: |
          mkdir -p target/bench
          cp .local/ci-harness-bin/restream .local/ci-harness-bin/test_harness target/bench/
          install -D -m 0755 .local/ci-harness-bin/xtask .local/bin/xtask
          chmod 0755 target/bench/restream target/bench/test_harness
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/system-deps
        with:
          profile: harness-runtime
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: test/e2e/moq/package-lock.json
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Install the MoQ browser specs (@moq/watch 0.6.3, Chromium, Firefox)
        working-directory: test/e2e/moq
        run: |
          flock -x /tmp/restream-host.lock npm ci
          flock -x /tmp/restream-host.lock npx playwright install --with-deps chromium firefox
      - if: ${{ steps.scope.outputs.run == 'true' }}
        # Headless Firefox plays audio only through a running audio server:
        # without one its AudioContext never starts and decoded audio never
        # advances. A null sink is enough (Chromium has its own fake output).
        name: Start a PulseAudio null sink for Firefox audio
        run: |
          sudo apt-get install -y -qq pulseaudio
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=moq_null
          pactl set-default-sink moq_null
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Fetch the pinned moq.dev tools (moq-cli 0.14.7, moq-relay 0.17.7, SHA256-verified, into .local/bin)
        run: .local/bin/xtask fetch moq-dev
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Run moq-dev-interop with the browser specs
        env:
          BENCH_BUILD: never
          HARNESS_BIN: target/bench/test_harness
          RESTREAM_BIN: target/bench/restream
        run: flock -x /tmp/restream-host.lock timeout --kill-after=30s 15m .local/bin/xtask harness moq-dev-interop -- --no-netns --browsers
      - if: ${{ always() && steps.scope.outputs.run == 'true' }}
        name: Run moqt-19 MSF/LOC in both directions through moq-relay
        env:
          BENCH_BUILD: never
          HARNESS_BIN: target/bench/test_harness
          RESTREAM_BIN: target/bench/restream
        run: flock -x /tmp/restream-host.lock timeout --kill-after=30s 15m .local/bin/xtask harness moq-dev-interop -- --no-netns --ietf
      - if: ${{ always() && steps.scope.outputs.run == 'true' }}
        name: Upload MoQ interop evidence
        uses: actions/upload-artifact@v7
        with:
          name: moq-interop-${{ github.sha }}
          # Per mode: report.json, relay logs, Restream log, CLI/FFmpeg logs and
          # captures with their FFprobe JSON; moq-dev-interop/browser/ holds the
          # Playwright log, JSON report, traces and failure screenshots.
          path: |
            .local/artifacts/moq-dev-interop/
            .local/artifacts/moq-dev-interop-ietf/
          if-no-files-found: warn
          retention-days: 7
