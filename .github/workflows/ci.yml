name: PR and branch CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RESTREAM_CI_HARNESS_IMAGE: ghcr.io/${{ github.repository }}-ci-harness-runtime:ubuntu24

jobs:
  format:
    name: Source formatting and TS types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          rust_components: rustfmt
          node_version: '22'
          npm_ci: 'true'
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check TypeScript types
        run: npx tsc -p tsconfig.json --noEmit

  lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          rust_components: clippy
          system_deps_profile: base
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Run clippy for library
        run: scripts/build/resource-limit.sh cargo clippy --lib -- -D warnings
      - name: Run clippy for all targets
        run: scripts/build/resource-limit.sh cargo clippy --workspace --all-targets -- -D warnings
      - name: Run clippy for MCP-enabled release surface
        run: |
          scripts/build/resource-limit.sh cargo clippy \
            --workspace \
            --all-targets \
            --features mcp-server,mcp-http-backend \
            -- -D warnings

  architecture-guardrails:
    name: Source architecture audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check source size and generated-file boundaries
        run: ./scripts/check/source-audit.sh
      - name: Upload source audit report
        uses: actions/upload-artifact@v7
        with:
          name: source-audit
          path: target/source-audit.json

  docker-runtime-smoke:
    name: Docker runtime source-build smoke (targeted)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        name: Decide whether Docker runtime smoke is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$base" --depth=1 || true
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -Eq '^(Dockerfile|scripts/build/app-native\.sh|scripts/release/package-binaries\.sh|scripts/release/package-runtime-image\.sh|scripts/check/container-smoke\.sh|scripts/check/release-evidence\.sh|scripts/release/prepare-build-tree\.sh|distribution/|\.github/workflows/release\.yml|\.github/workflows/ci-harness-runtime-image\.yml)$'; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.scope.outputs.run == 'false' }}
        name: Runtime path unchanged; skip Docker smoke
        run: echo "Docker runtime source-build path unchanged; skipping smoke."
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Runtime path changed; continue Docker smoke
        run: echo "Docker runtime source-build path changed; continuing."
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          system_deps_profile: build
          native_prefix: 'true'
          rust_cache: 'true'
      - if: ${{ steps.scope.outputs.run == 'true' }}
        uses: docker/setup-buildx-action@v4
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Build runtime image from Dockerfile
        run: scripts/release/prepare-build-tree.sh
      - if: ${{ steps.scope.outputs.run == 'true' }}
        name: Smoke production runtime image
        env:
          RESTREAM_CONTAINER_IMAGE: restream:pr-runtime-smoke
          RESTREAM_DOCKER_GHA_CACHE: "1"
        run: scripts/check/container-smoke.sh --image "$RESTREAM_CONTAINER_IMAGE"

  api-contract:
    name: API contract smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: live
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Run API contract smoke
        run: ./scripts/check/api-contract.sh

  frontend:
    name: Frontend unit and browser DOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
      - name: Run frontend unit tests
        run: npm run test:frontend
      - name: Install Chromium for DOM tests
        run: npx playwright install --with-deps chromium
      - name: Run browser DOM tests
        run: npm run test:frontend:browser-dom

  frontend-e2e:
    name: Frontend app E2E
    runs-on: ubuntu-24.04
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: browser
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Install Chromium for app E2E
        run: npx playwright install --with-deps chromium
      - name: Run isolated app E2E
        run: npm run test:e2e

  concurrency-contract:
    name: Concurrency lifecycle proof
    runs-on: ubuntu-24.04
    needs: api-contract
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          system_deps_profile: live
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Run concurrency lifecycle proof
        env:
          # Hosted runners cannot preserve the optional private network
          # namespace setup; keep the live fault slices on the same host-network
          # fallback used by the other hosted harness jobs.
          CONCURRENCY_HARNESS_ARGS: "--no-netns"
        run: bash ./scripts/check/concurrency/contract.sh

  test:
    name: Rust unit hygiene and fixtures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: base
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Build frontend assets for Rust tests
        run: npm run build:frontend
      - name: Check Rust test hygiene
        run: ./scripts/check/test-hygiene.sh
      - name: Check fixture discipline
        run: ./scripts/check/fixture-discipline.sh

  coverage:
    name: Workspace coverage report
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          rust_components: llvm-tools-preview
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: base
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Build frontend assets for coverage
        run: npm run build:frontend
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate workspace coverage
        run: scripts/build/resource-limit.sh cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Upload workspace coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Print coverage summary
        run: |
          echo "=== Coverage summary ==="
          cargo llvm-cov report --summary-only 2>/dev/null || true

  integration-build:
    name: PR live-smoke harness build
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: build
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Build frontend assets for harness binaries
        run: npm run build:frontend
      - name: Build bench-profile harness binaries
        run: ./scripts/build/bench-harness.sh
      - name: Stage PR live-smoke harness artifact
        run: |
          mkdir -p .local/ci-harness-bin
          cp target/bench/restream target/bench/test_harness .local/ci-harness-bin/
      - uses: actions/upload-artifact@v7
        with:
          name: ci-harness-bin-${{ github.sha }}
          path: .local/ci-harness-bin/*
          retention-days: 1

  integration-shards:
    needs: integration-build
    uses: ./.github/workflows/_harness-runtime-shards.yml
    with:
      artifact_name: ci-harness-bin-${{ github.sha }}
      artifact_path: .local/ci-harness-bin
      install_dir: target/bench
      harness_bin: target/bench/test_harness
      restream_bin: target/bench/restream
      shard_name_prefix: PR live-smoke shard
      artifact_upload_prefix: integration
      artifact_upload_path: .local/artifacts/
      artifact_retention_days: 3
      upload_artifacts_mode: failure_or_cancelled
      timeout_minutes: 30
      max_parallel: 5
      shards_json: >-
        ["smoke","mixed.live.rtmp.h264.a1","mixed.live.srt.h264.a1","mixed.live.srt.h265.a1","mixed.live.srt.h265.a2"]
    secrets:
      gh_token: ${{ github.token }}

  internal-backend-smoke:
    name: Internal media backend smoke
    runs-on: ubuntu-24.04
    needs: integration-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ci-harness-bin-${{ github.sha }}
          path: .local/ci-harness-bin
      - name: Install internal-backend harness binaries
        run: |
          mkdir -p target/bench
          cp .local/ci-harness-bin/restream .local/ci-harness-bin/test_harness target/bench/
          chmod 0755 target/bench/restream target/bench/test_harness
      - name: Run internal media backend rollout smoke
        env:
          BENCH_BUILD: never
          GH_TOKEN: ${{ github.token }}
          INTERNAL_BACKEND_SMOKE_CONTINUE_ON_FAIL: "1"
          # Hosted runners cannot preserve the SRT sysctls inside the optional
          # user namespace; keep all live slices on the same host-network
          # fallback instead of letting this nested runner regress separately.
          TEST_HARNESS_USE_HOST_NET: "1"
        run: scripts/ci/run-in-harness-runtime.sh scripts/harness/rollouts/internal-backend-smoke.sh
      - name: Upload internal media backend artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: internal-backend-smoke
          path: .local/artifacts/internal-backend-smoke/
          if-no-files-found: ignore

  playwright:
    name: HLS browser playback E2E
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          system_deps_profile: browser
          native_prefix: 'true'
          rust_cache: 'true'
      - name: Install Chromium for HLS E2E
        run: npx playwright install chromium
      - name: Build frontend assets for HLS E2E
        run: npm run build:frontend
      - name: Build app binary for HLS E2E
        run: scripts/build/resource-limit.sh cargo build --release
      - name: Seed HLS E2E media library
        run: |
          mkdir -p .local/e2e/media .local/e2e/logs
          cp test/fixtures/media-library/colorbar-timer-2v16a.mp4 .local/e2e/media/
      - name: Start app for HLS E2E
        env:
          RESTREAM_DB_PATH: .local/e2e/restream.db
          RESTREAM_MEDIA_DIR: .local/e2e/media
          RESTREAM_LOG_DIR: .local/e2e/logs
          RESTREAM_INITIAL_ADMIN_PASSWORD: admin
        run: ./target/release/restream &
      - name: Wait for HLS E2E app
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3030/healthz; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready" >&2
          exit 1
      - name: Run HLS Playwright tests
        run: npx playwright test
      - name: Upload HLS E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: .local/test-results/
          if-no-files-found: ignore
