name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Branch dry-runs should not stack stale release attempts. Tag runs are kept
# independent because a published tag is an immutable release event.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # workflow_dispatch runs from a branch, whose ref_name may contain '/' and is
  # not a valid package version/path. Give non-tag evidence a stable,
  # filename-safe local label while preserving the exact v* release tag.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci-{0}', github.run_number) }}
  # Live harness shards run inside this prebuilt runtime image so the matrix
  # does not repeat apt/MediaMTX setup. Keep its contents in Dockerfile +
  # scripts/dev/bootstrap-runtime.sh, not in release.yml.
  RESTREAM_CI_HARNESS_IMAGE: ghcr.io/${{ github.repository }}-ci-harness-runtime:ubuntu24

jobs:
  package-build:
    name: Release package build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          system_deps_profile: build
          rust_cache: 'true'
      - uses: docker/setup-buildx-action@v4
      - name: Prepare release build tree
        # Clean runners do not have generated public/ assets. The harness
        # compile embeds public/ before packaging runs, so prepare the tree via
        # the same canonical release script used by packaging instead of
        # relying on developer-local generated files.
        run: scripts/release/prepare-build-tree.sh
      - name: Package release Linux binaries
        env:
          RESTREAM_DOCKER_GHA_CACHE: "1"
        # Build the exact downloadable release payload first so every later
        # certification step reads from the same shipped bytes.
        run: scripts/release/package-binaries.sh "$RELEASE_VERSION"
      - name: Stage release certification binaries
        run: |
          mkdir -p .local/release-certify-bin
          cp target/release/restream .local/release-certify-bin/restream
          cp target/release/test_harness .local/release-certify-bin/test_harness
      - uses: actions/upload-artifact@v7
        with:
          name: release-certify-bin-${{ github.sha }}
          path: .local/release-certify-bin/*
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            dist/
          if-no-files-found: error
          retention-days: 1

  package-build-aarch64:
    name: Release package build (aarch64)
    # Native arm64 runner: the host archives are built where they run, so the
    # linkage check and the artifact smoke exercise the shipped bytes.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          system_deps_profile: build
          rust_cache: 'true'
      - name: Prepare release build tree
        run: scripts/release/prepare-build-tree.sh
      - name: Package release Linux binaries
        env:
          RESTREAM_RELEASE_IMAGE: '0'
        run: scripts/release/package-binaries.sh "$RELEASE_VERSION"
      - name: Smoke the packaged binary
        run: scripts/check/release-artifact-smoke.sh "dist/restream-${RELEASE_VERSION}-linux-aarch64.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist-aarch64-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  full-live-harness:
    needs: package-build
    uses: ./.github/workflows/_harness-runtime-shards.yml
    with:
      artifact_name: release-certify-bin-${{ github.sha }}
      artifact_path: .local/release-certify-bin
      install_dir: target/release
      harness_bin: target/release/test_harness
      restream_bin: target/release/restream
      shard_name_prefix: Release live harness shard
      artifact_upload_prefix: release-harness
      artifact_upload_path: .local/artifacts/
      artifact_retention_days: 3
      upload_artifacts_mode: always
      timeout_minutes: 70
      max_parallel: 20
      shards_json: >-
        ["mixed.file.h265.a2.bf2","mixed.file.h265.a2.bf0","mixed.live.srt.h265.a2.bf0","mixed.live.srt.h265.a2.bf2","mixed.live.srt.h264.a2.bf2","mixed.live.srt.h264.a2.bf0","mixed.file.h264.a2.bf0","mixed.file.h264.a2.bf2","srt-crypto-matrix","ramp-family","mixed.file.h265.a1.bf0","mixed.file.h265.a1.bf2","mixed.live.srt.h265.a1.bf0","mixed.live.srt.h265.a1.bf2","mixed.file.h264.a1.bf2","mixed.file.h264.a1.bf0","mixed.live.rtmp.h264.a1.bf0","mixed.live.rtmp.h264.a1.bf2","bitrate-sweep.h264-rtmp","bitrate-sweep.h265-srt","bitrate-sweep.h264-srt","bitrate-sweep.mixed-h264-a2","bitrate-sweep.mixed-h265-a2","branch-matrix","fault.resilience","resource-sweep.source","resource-sweep.transcode","resource-sweep.hevc","smoke","mixed.live.srt.h264.a1.bf0","mixed.live.srt.h264.a1.bf2"]
    secrets:
      gh_token: ${{ github.token }}

  package-evidence:
    name: Release package and evidence
    runs-on: ubuntu-24.04
    needs:
      - package-build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          node_version: '22'
          npm_ci: 'true'
          # `live`: release evidence runs the container smoke, whose SRT
          # capability proof drives the live harness (FFmpeg and host tools).
          system_deps_profile: live
          rust_cache: 'true'
      - uses: ./.github/actions/security-tools
      - name: Build the live harness used by the container SRT proof
        run: |
          npm run build:frontend
          cargo xtask build-bench
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          # Restore the packaged release payload under dist/ so every later
          # path matches the archive layout produced by package-binaries.sh.
          path: dist
      - name: Verify release evidence and OCI asset
        # Pass the completed bundle so its exact restream executable emits the
        # SBOM; certifying a separate default-feature rebuild would leave the
        # downloadable feature-enabled artifact unscanned.
        run: |
          scripts/check/release-evidence.sh \
            "dist/restream-${RELEASE_VERSION}-oci.tar.gz" \
            "dist/restream-${RELEASE_VERSION}-linux-x86_64.sbom.cdx.json" \
            "dist/restream-${RELEASE_VERSION}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            dist/
            .local/artifacts/release-${{ github.sha }}/
          if-no-files-found: ignore
          retention-days: 3

  certify:
    name: Release dry-run certification
    runs-on: ubuntu-24.04
    needs:
      - full-live-harness
      - package-evidence
      - package-build-aarch64
    steps:
      - run: |
          echo "Release dry-run certified: full live harness shards, package evidence and the aarch64 package passed."

  publish:
    name: Release publish
    runs-on: ubuntu-24.04
    needs: certify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
      # Sigstore-signed build provenance and SBOM attestations (keyless,
      # through the workflow's OIDC identity).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          # Publish reads the same dist/ layout produced during package-build
          # and rehydrated during evidence verification.
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-aarch64-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: dist-aarch64
      - name: Normalize release dist layout
        run: |
          if [[ -d dist/dist ]]; then
            cp -a dist/dist/. dist/
            rm -rf dist/dist
          fi
          cp -a dist-aarch64/. dist/
          # The SBOM inside each restream archive is also published beside it,
          # so it can be attested against the archive.
          for arch in linux-x86_64 linux-aarch64; do
            tar -xzf "dist/restream-${GITHUB_REF_NAME}-${arch}.tar.gz" -C dist --strip-components=1 \
              "restream-${GITHUB_REF_NAME}-${arch}/restream-${GITHUB_REF_NAME}-${arch}.sbom.cdx.json"
          done
          (cd dist && sha256sum restream-*.tar.gz restream-*.json test-harness-*.tar.gz > SHA256SUMS)
      - name: Publish release runtime image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          RESTREAM_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          RESTREAM_CONTAINER_IMAGE: restream:release
        run: |
          docker load -i "dist/restream-${RELEASE_VERSION}-oci.tar.gz"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/release/publish-image.sh "$GITHUB_REF_NAME"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$RESTREAM_REGISTRY_IMAGE:$GITHUB_REF_NAME")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance for the release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/restream-*.tar.gz
            dist/restream-mcp-*.tar.gz
            dist/test-harness-*.tar.gz
            dist/restream-*-seccomp.json
      - name: Attest build provenance for the runtime image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest the x86_64 SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/restream-${{ github.ref_name }}-linux-x86_64.tar.gz
          sbom-path: dist/restream-${{ github.ref_name }}-linux-x86_64.sbom.cdx.json
      - name: Attest the aarch64 SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/restream-${{ github.ref_name }}-linux-aarch64.tar.gz
          sbom-path: dist/restream-${{ github.ref_name }}-linux-aarch64.sbom.cdx.json
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/restream-"$GITHUB_REF_NAME"-oci.tar.gz \
            dist/restream-"$GITHUB_REF_NAME"-seccomp.json \
            dist/SHA256SUMS \
            dist/restream-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz \
            dist/restream-"$GITHUB_REF_NAME"-linux-x86_64.sbom.cdx.json \
            dist/restream-mcp-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz \
            dist/test-harness-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz \
            dist/restream-"$GITHUB_REF_NAME"-linux-aarch64.tar.gz \
            dist/restream-"$GITHUB_REF_NAME"-linux-aarch64.sbom.cdx.json \
            dist/restream-mcp-"$GITHUB_REF_NAME"-linux-aarch64.tar.gz \
            dist/test-harness-"$GITHUB_REF_NAME"-linux-aarch64.tar.gz \
            --generate-notes
