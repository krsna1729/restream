name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# Branch dry-runs should not stack stale release attempts. Tag runs are kept
# independent because a published tag is an immutable release event.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # workflow_dispatch runs from a branch, whose ref_name may contain '/' and is
  # not a valid package version/path. Give non-tag evidence a stable,
  # filename-safe local label while preserving the exact v* release tag.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci-{0}', github.run_number) }}

jobs:
  prepare-build:
    name: Prepare harness binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/system-deps
        with: { profile: build }
      - uses: ./.github/actions/native-prefix
      - name: Prepare release build tree
        # Clean runners do not have generated public/ assets. The harness
        # compile embeds public/ before packaging runs, so prepare the tree via
        # the same canonical release script used by packaging instead of
        # relying on developer-local generated files.
        run: scripts/release/prepare-build-tree.sh
      - name: Build canonical bench harness binaries
        run: scripts/build/bench-harness.sh
      - name: Stage harness binary artifact
        run: |
          mkdir -p .local/release-harness-bin
          cp target/bench/restream target/bench/test_harness .local/release-harness-bin/
      - uses: actions/upload-artifact@v7
        with:
          name: release-harness-bin-${{ github.sha }}
          path: .local/release-harness-bin/*
          retention-days: 1

  full-live-harness:
    name: Full live harness (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: prepare-build
    # The shard script owns scenario-specific timeout messages. Keep the
    # workflow ceiling above its largest 30m bucket so GitHub does not cut the
    # process off before it can print TIMEOUT and upload harness artifacts.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Keep this below the GitHub Free hosted-runner ceiling. Starting all
      # harness jobs at once made every shard hit apt, artifact download, and
      # MediaMTX bootstrap together; the release script owns per-shard timeouts,
      # while this cap smooths setup bursts without serializing the suite.
      max-parallel: 12
      matrix:
        shard:
          - smoke
          - mixed.live.rtmp.h264.a1
          - mixed.live.srt.h264.a1
          - mixed.live.srt.h264.a2
          - mixed.live.srt.h265.a1
          - mixed.live.srt.h265.a2
          - mixed.file.h264.a1
          - mixed.file.h264.a2
          - mixed.file.h265.a1
          - mixed.file.h265.a2
          - bitrate-sweep.h264-rtmp
          - bitrate-sweep.h264-srt
          - bitrate-sweep.h265-srt
          - bitrate-sweep.mixed-h264-a2
          - bitrate-sweep.mixed-h265-a2
          - resource-sweep.source
          - resource-sweep.transcode
          - resource-sweep.hevc
          - ramp-family
          - srt-crypto-matrix
          - branch-matrix
          - fault.resilience
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/system-deps
        with: { profile: harness-runtime }
      - uses: actions/download-artifact@v8
        with:
          name: release-harness-bin-${{ github.sha }}
          path: .local/release-harness-bin
      - name: Install prepared harness binaries
        run: |
          mkdir -p target/bench
          cp .local/release-harness-bin/restream .local/release-harness-bin/test_harness target/bench/
          chmod 0755 target/bench/restream target/bench/test_harness
      - name: Run full release harness shard
        env:
          BENCH_BUILD: never
        run: scripts/release/harness-shard.sh "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-harness-${{ matrix.shard }}-${{ github.sha }}
          path: .local/artifacts/release-${{ github.sha }}-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 3

  package-evidence:
    name: Package and release evidence
    runs-on: ubuntu-latest
    needs:
      - prepare-build
      - full-live-harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/system-deps
        with: { profile: build }
      - uses: ./.github/actions/native-prefix
      # Reuse established installers instead of compiling audit/scanner CLIs on
      # every hosted release worker. The canonical release-evidence script below
      # still owns the actual policy.
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq && sudo apt-get install -y -qq trivy
      - name: Package every supported Linux binary
        # This canonical script installs the locked frontend dependencies and
        # builds generated assets before compiling the feature-enabled binaries.
        run: scripts/release/package-binaries.sh "$RELEASE_VERSION"
      - name: Release evidence and OCI asset
        # Pass the completed bundle so its exact restream executable emits the
        # SBOM; certifying a separate default-feature rebuild would leave the
        # downloadable feature-enabled artifact unscanned.
        run: |
          scripts/check/release-evidence.sh \
            "dist/restream-${RELEASE_VERSION}-oci.tar.gz" \
            "dist/restream-${RELEASE_VERSION}.sbom.cdx.json" \
            "dist/restream-${RELEASE_VERSION}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            dist/
            .local/artifacts/release-${{ github.sha }}/
          if-no-files-found: ignore
          retention-days: 3

  certify:
    name: Certify release dry-run
    runs-on: ubuntu-latest
    needs:
      - package-evidence
    steps:
      - run: |
          echo "Release dry-run certified: full live harness shards and package evidence passed."

  publish:
    name: Publish certified release
    runs-on: ubuntu-latest
    needs: certify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: .
      - name: Publish certified scratch image
        env:
          GH_TOKEN: ${{ github.token }}
          RESTREAM_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          RESTREAM_CONTAINER_IMAGE: restream:release
        run: |
          docker load -i "dist/restream-${RELEASE_VERSION}-oci.tar.gz"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/release/publish-image.sh "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/restream-"$GITHUB_REF_NAME"-oci.tar.gz \
            dist/restream-"$GITHUB_REF_NAME"-oci.tar.gz.sha256 \
            dist/restream-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz \
            dist/restream-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz.sha256 \
            dist/restream-"$GITHUB_REF_NAME".sbom.cdx.json --generate-notes
