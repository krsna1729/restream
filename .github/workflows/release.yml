name: Release certification

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Branch dry-runs should not stack stale release attempts. Tag runs are kept
# independent because a published tag is an immutable release event.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # workflow_dispatch runs from a branch, whose ref_name may contain '/' and is
  # not a valid package version/path. Give non-tag evidence a stable,
  # filename-safe local label while preserving the exact v* release tag.
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-ci-{0}', github.run_number) }}
  # Live harness shards run inside this prebuilt runtime image so the matrix
  # does not repeat apt/MediaMTX setup. Keep its contents in Dockerfile +
  # scripts/dev/bootstrap-runtime.sh, not in release.yml.
  RESTREAM_CI_HARNESS_IMAGE: ghcr.io/${{ github.repository }}-ci-harness-runtime:ubuntu24

jobs:
  package-build:
    name: Release package build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/system-deps
        with: { profile: build }
      - uses: ./.github/actions/native-prefix
      - uses: ./.github/actions/rust-cache
      - name: Prepare release build tree
        # Clean runners do not have generated public/ assets. The harness
        # compile embeds public/ before packaging runs, so prepare the tree via
        # the same canonical release script used by packaging instead of
        # relying on developer-local generated files.
        run: scripts/release/prepare-build-tree.sh
      - name: Package release Linux binaries
        # Build the exact downloadable release payload first so every later
        # certification step reads from the same shipped bytes.
        run: scripts/release/package-binaries.sh "$RELEASE_VERSION"
      - name: Stage release certification binaries
        run: |
          mkdir -p .local/release-certify-bin
          cp target/release/restream .local/release-certify-bin/restream
          cp target/release/test_harness .local/release-certify-bin/test_harness
      - uses: actions/upload-artifact@v7
        with:
          name: release-certify-bin-${{ github.sha }}
          path: .local/release-certify-bin/*
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            dist/
          if-no-files-found: error
          retention-days: 1

  full-live-harness:
    name: Release live harness shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    needs: package-build
    # The shard script owns scenario-specific timeout messages. Keep the
    # workflow ceiling above its largest 30m bucket so GitHub does not cut the
    # process off before it can print TIMEOUT and upload harness artifacts.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Shards run inside the prebuilt CI harness image, so the old apt and
      # MediaMTX bootstrap burst is gone. Keep a small cap below the full shard
      # count to smooth image/artifact pulls while using most hosted capacity.
      max-parallel: 20
      matrix:
        shard:
          - smoke
          - mixed.live.rtmp.h264.a1
          - mixed.live.srt.h264.a1
          - mixed.live.srt.h264.a2
          - mixed.live.srt.h265.a1
          - mixed.live.srt.h265.a2
          - mixed.file.h264.a1
          - mixed.file.h264.a2
          - mixed.file.h265.a1
          - mixed.file.h265.a2
          - bitrate-sweep.h264-rtmp
          - bitrate-sweep.h264-srt
          - bitrate-sweep.h265-srt
          - bitrate-sweep.mixed-h264-a2
          - bitrate-sweep.mixed-h265-a2
          - resource-sweep.source
          - resource-sweep.transcode
          - resource-sweep.hevc
          - ramp-family
          - srt-crypto-matrix
          - branch-matrix
          - fault.resilience
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-certify-bin-${{ github.sha }}
          path: .local/release-certify-bin
      - name: Install release certification binaries
        run: |
          mkdir -p target/release
          cp .local/release-certify-bin/restream target/release/restream
          cp .local/release-certify-bin/test_harness target/release/test_harness
          chmod 0755 target/release/restream target/release/test_harness
      - name: Run release live harness shard
        env:
          BENCH_BUILD: never
          HARNESS_BIN: target/release/test_harness
          RESTREAM_BIN: target/release/restream
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/run-harness-shard-in-runtime.sh "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-harness-${{ matrix.shard }}-${{ github.sha }}
          path: .local/artifacts/release-${{ github.sha }}-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 3

  package-evidence:
    name: Release package and evidence
    runs-on: ubuntu-24.04
    needs:
      - package-build
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: ./.github/actions/system-deps
        with: { profile: build }
      - uses: ./.github/actions/native-prefix
      - uses: ./.github/actions/rust-cache
      - uses: ./.github/actions/security-tools
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: .
      - name: Verify release evidence and OCI asset
        env:
          RESTREAM_DOCKER_GHA_CACHE: "1"
        # Pass the completed bundle so its exact restream executable emits the
        # SBOM; certifying a separate default-feature rebuild would leave the
        # downloadable feature-enabled artifact unscanned.
        run: |
          scripts/check/release-evidence.sh \
            "dist/restream-${RELEASE_VERSION}-oci.tar.gz" \
            "dist/restream-${RELEASE_VERSION}.sbom.cdx.json" \
            "dist/restream-${RELEASE_VERSION}-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: |
            dist/
            .local/artifacts/release-${{ github.sha }}/
          if-no-files-found: ignore
          retention-days: 3

  certify:
    name: Release dry-run certification
    runs-on: ubuntu-24.04
    needs:
      - full-live-harness
      - package-evidence
    steps:
      - run: |
          echo "Release dry-run certified: full live harness shards and package evidence passed."

  publish:
    name: Release publish
    runs-on: ubuntu-24.04
    needs: certify
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-dist-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: .
      - name: Publish release scratch image
        env:
          GH_TOKEN: ${{ github.token }}
          RESTREAM_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          RESTREAM_CONTAINER_IMAGE: restream:release
        run: |
          docker load -i "dist/restream-${RELEASE_VERSION}-oci.tar.gz"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/release/publish-image.sh "$GITHUB_REF_NAME"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/restream-"$GITHUB_REF_NAME"-oci.tar.gz \
            dist/restream-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz \
            dist/restream-mcp-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz \
            dist/test-harness-"$GITHUB_REF_NAME"-linux-x86_64.tar.gz \
            --generate-notes
