name: Scheduled security scans

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sbom-scan:
    name: Scheduled SBOM vulnerability scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          system_deps_profile: base
          native_prefix: 'true'
          rust_cache: 'true'

      - name: Build bench binary for SBOM scan
        run: scripts/build/bench-harness.sh

      - name: Emit scheduled runtime SBOM
        run: |
          ./target/bench/restream --emit-sbom restream.cdx.json

      - name: Install SBOM security scanners
        uses: ./.github/actions/security-tools

      - name: Scan SBOM with grype
        run: |
          grype sbom:restream.cdx.json \
            --output sarif=grype-results.sarif \
            --output json=grype-results.json || true

      - name: Scan SBOM with trivy
        run: |
          trivy sbom restream.cdx.json \
            --format sarif \
            --output trivy-results.sarif \
            --severity HIGH,CRITICAL || true

      - name: Upload grype SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype

      - name: Upload trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: File issue for scheduled HIGH/CRITICAL findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f grype-results.json ]; then
            echo "No grype results JSON; skipping issue creation."
            exit 0
          fi

          FINDINGS=$(python3 - <<'PYEOF'
          import json, sys
          with open("grype-results.json") as f:
              data = json.load(f)
          matches = data.get("matches", [])
          high_crit = [
              m for m in matches
              if m.get("vulnerability", {}).get("severity", "").upper() in ("HIGH", "CRITICAL")
          ]
          if not high_crit:
              print("NONE")
              sys.exit(0)
          lines = []
          for m in high_crit:
              v = m.get("vulnerability", {})
              art = m.get("artifact", {})
              lines.append(f"- **{v.get('id','')}** ({v.get('severity','')}) in `{art.get('name','')} {art.get('version','')}`: {v.get('description','')[:120]}")
          print("\n".join(lines))
          PYEOF
          )

          if [ "$FINDINGS" = "NONE" ]; then
            echo "No HIGH/CRITICAL findings; skipping issue."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          EXISTING=$(gh issue list --label security-sbom --state open --json number --jq '.[0].number // empty')

          BODY="## SBOM Vulnerability Findings — $DATE

          The nightly SBOM scan found the following HIGH or CRITICAL vulnerabilities:

          $FINDINGS

          **Scan artifacts:** grype-results.json, trivy-results.sarif (uploaded to GitHub Security tab)
          "

          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "SBOM Security Findings $DATE" \
              --label security-sbom \
              --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi

  cargo-audit:
    name: Scheduled cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Run scheduled cargo audit
        run: cargo audit

  cargo-deny:
    name: Scheduled cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run scheduled cargo deny
        run: cargo deny check advisories licenses bans sources
