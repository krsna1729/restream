name: Security

on:
  schedule:
    # 20:30 UTC = 02:00 IST (Asia/Kolkata, UTC+5:30) the next calendar day,
    # one hour after the nightly full-certification run. GitHub Actions cron
    # always runs in UTC; there is no timezone field for workflow-level
    # schedules, so keep this comment in sync if the target IST time changes.
    - cron: '30 20 * * *'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sbom-scan:
    name: Scheduled SBOM vulnerability scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
        with:
          system_deps_profile: base
          rust_cache: 'true'

      - name: Build bench binary for SBOM scan
        run: cargo xtask build-bench

      - name: Emit scheduled runtime SBOM
        run: |
          ./target/bench/restream --emit-sbom restream.cdx.json

      - name: Install SBOM security scanners
        uses: ./.github/actions/security-tools

      - name: Scan SBOM with grype
        run: |
          grype sbom:restream.cdx.json \
            --output sarif=grype-results.sarif \
            --output json=grype-results.json || true

      - name: Scan SBOM with trivy
        run: |
          trivy sbom restream.cdx.json \
            --format sarif \
            --output trivy-results.sarif \
            --severity HIGH,CRITICAL || true

      - name: Upload grype SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype

      - name: Upload trivy SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: File issue for scheduled HIGH/CRITICAL findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f grype-results.json ]; then
            echo "No grype results JSON; skipping issue creation."
            exit 0
          fi

          FINDINGS=$(jq -r '
            [(.matches // [])[]
              | select((.vulnerability.severity // "" | ascii_upcase) as $s
                       | $s == "HIGH" or $s == "CRITICAL")]
            | if length == 0 then "NONE"
              else map("- **\(.vulnerability.id // "")** (\(.vulnerability.severity // "")) in `\(.artifact.name // "") \(.artifact.version // "")`: \((.vulnerability.description // "")[:120])")
                | join("\n")
              end' grype-results.json)

          if [ "$FINDINGS" = "NONE" ]; then
            echo "No HIGH/CRITICAL findings; skipping issue."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          EXISTING=$(gh issue list --label security-sbom --state open --json number --jq '.[0].number // empty')

          BODY="## SBOM Vulnerability Findings — $DATE

          The nightly SBOM scan found the following HIGH or CRITICAL vulnerabilities:

          $FINDINGS

          **Scan artifacts:** grype-results.json, trivy-results.sarif (uploaded to GitHub Security tab)
          "

          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "SBOM Security Findings $DATE" \
              --label security-sbom \
              --body "$BODY"
          else
            gh issue comment "$EXISTING" --body "$BODY"
          fi

  cargo-deny:
    name: Cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-bootstrap
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: Run cargo deny
        run: cargo deny check advisories licenses bans sources
