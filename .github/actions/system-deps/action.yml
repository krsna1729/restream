name: System dependencies
description: Install one canonical Ubuntu system-dependency profile for CI.

inputs:
  profile:
    description: base/build, browser/browser-build, live/live-build, harness-runtime/live-runtime, or native-build
    required: true
    default: base

runs:
  using: composite
  steps:
    - shell: bash
      run: scripts/ci/install-system-deps.sh "${{ inputs.profile }}"
