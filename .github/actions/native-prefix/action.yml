name: Native prefix
description: Restore or build the repository-managed static media dependency prefix.

runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          .local/build/static/prefix
          .local/build/static/stamps
          .local/build/static/env.sh
          .local/build/static/ffmpeg-standalone-build
          public/bin/ffmpeg
        key: static-prefix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/native-deps.sh', 'scripts/build/native/native-inputs.lock', 'scripts/native/mbedtls-config-srt.h', 'test/native/ffmpeg-capabilities.c') }}
    - name: Report native prefix cache state
      shell: bash
      run: |
        echo "native-prefix: key=${{ steps.restore.outputs.cache-primary-key }}"
        echo "native-prefix: cache-hit=${{ steps.restore.outputs.cache-hit }}"
    - if: steps.restore.outputs.cache-hit != 'true'
      name: Build native prefix
      shell: bash
      run: scripts/build/resource-limit.sh ./scripts/build/native-deps.sh
    - if: steps.restore.outputs.cache-hit != 'true'
      name: Save native prefix cache
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: |
          .local/build/static/prefix
          .local/build/static/stamps
          .local/build/static/env.sh
          .local/build/static/ffmpeg-standalone-build
          public/bin/ffmpeg
        key: ${{ steps.restore.outputs.cache-primary-key }}
