name: Rust cache
description: Restore shared Cargo and target build caches for hosted CI jobs.

runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'build.rs', '.cargo/config.toml') }}
        cache-targets: true
        cache-all-crates: true
        workspaces: |
          . -> target
