name: Rust cache
description: Restore shared Cargo and target build caches for hosted CI jobs.

runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: restream-${{ runner.os }}-${{ runner.arch }}
        cache-targets: true
        cache-all-crates: true
        workspaces: |
          . -> target
