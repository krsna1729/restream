[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.20 derives advisory severity from the advisory database. Keep
# this section minimal so release CI can use the current prebuilt cargo-deny
# binary without schema drift blocking the real vulnerability check.
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is pulled through the dev-only pulp benchmark dependency; keep visible through cargo audit warnings while avoiding a release hard block." },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "WTFPL",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# These duplicate families currently come through independent ecosystem stacks.
# Keep them visible as warnings while avoiding a hard CI block until upstream
# dependencies converge.
skip = [
  { name = "hashbrown" },
  { name = "thiserror" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
