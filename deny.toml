[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.20 derives advisory severity from the advisory database. Keep
# this section minimal so release CI can use the current prebuilt cargo-deny
# binary without schema drift blocking the real vulnerability check.
# Each ignore names why it ships nothing; cargo-deny warns once it no longer
# matches, so delete it then.
ignore = [
  # pin-utils unmaintained: reached only via loom (our loom-model
  # dev-dependency and upstream cfg(loom) builds) and wasm32-only wasmtimer.
  # loom 0.7.2 is the latest release; no shipped binary links it.
  { id = "RUSTSEC-2026-0441", reason = "dev/cfg(loom)/wasm32-only via loom 0.7.2 and wasmtimer; not in shipped binaries" },
  # SQLite WAL page-size mismatch (CVE-2026-119375). Restream opens only
  # its internal database and in-memory test databases; no user-supplied
  # SQLite/WAL files are opened. Upstream sqlx main has relaxed the
  # constraint (<0.40); delete this once sqlx 0.9.1 is released on crates.io.
  { id = "RUSTSEC-2026-0459", reason = "internal DB only; no user-supplied SQLite/WAL files; awaiting upstream sqlx 0.9.1" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "WTFPL",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
# These duplicate families currently come through independent ecosystem stacks.
# Keep them visible as warnings while avoiding a hard CI block until upstream
# dependencies converge.
skip = [
  { name = "hashbrown" },
  { name = "thiserror" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/krsna1729/srt-rs"]
