[package]
name = "restream"
version.workspace = true
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"
repository = "https://github.com/krsna1729/restream"

[workspace]
resolver = "3"
members = [
    "crates/xtask",
    "crates/restream-agent",
    "crates/restream-agent-contract",
    "crates/restream-core",
    "crates/restream-domain",
    "crates/restream-engine",
    "crates/restream-health",
    "crates/restream-mcp",
    "crates/restream-sync",
    "crates/restream-mpegts",
    "crates/restream-rtmp",
    "crates/restream-moq",
    "crates/restream-srt",
    "crates/test_harness",
]
default-members = [".", "crates/*"]

# `restream-mcp` checks that its target reports the same version and commit.
[workspace.package]
version = "0.1.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(fuzzing)', 'cfg(kani)'] }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
result_large_err = "allow"
chunks_exact_to_as_chunks = "allow"

[lints]
workspace = true
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# The agent plane (`crates/restream-agent`) and its approval-gated execution
# back the control room's Change Studio. `-p restream --no-default-features`
# removes them without workspace consumers re-enabling defaults through
# feature unification.
default = ["agent-execution"]
agent-plane = ["dep:restream-agent", "dep:restream-agent-contract"]
agent-execution = [
    "agent-plane",
    "restream-agent/agent-execution",
    "restream-agent-contract/agent-execution",
    "restream-mcp?/agent-execution",
]
# The MCP sidecar lives in `crates/restream-mcp`; these build it alongside the
# product (`cargo build --bin restream-mcp --features mcp-server,mcp-http-backend`).
mcp-core = ["dep:restream-mcp"]
mcp-server = ["mcp-core", "restream-mcp/mcp-server"]
mcp-http-backend = ["mcp-core", "restream-mcp/mcp-http-backend"]
mcp-embedded = ["mcp-core", "agent-plane"]

[dependencies]
restream-agent = { path = "crates/restream-agent", optional = true }
restream-agent-contract = { path = "crates/restream-agent-contract", optional = true }
restream-mcp = { path = "crates/restream-mcp", optional = true }
restream-core = { path = "crates/restream-core" }
restream-domain = { path = "crates/restream-domain" }
restream-engine = { path = "crates/restream-engine" }
restream-health = { path = "crates/restream-health" }
restream-sync = { path = "crates/restream-sync" }
restream-mpegts = { path = "crates/restream-mpegts" }
restream-rtmp = { path = "crates/restream-rtmp" }
restream-moq = { path = "crates/restream-moq" }
restream-srt = { path = "crates/restream-srt" }
tokio = { version = "1.39", features = [
    "fs", "io-util", "macros", "net", "process",
    "rt-multi-thread", "signal", "sync", "time",
] }
axum = { version = "0.8", features = ["macros", "multipart"] }
# The dashboard listener serves axum on hyper directly to allow half-closed
# HTTP/1.1 requests (HLS push encoders close right after the body).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors", "set-header", "compression-gzip"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.12"
sysinfo = "0.39"
libc = "0.2"
# Safe system-call wrappers (owned/borrowed fds, typed flags). The few calls it
# does not model (TCP_INFO, kTLS crypto setup, getrusage, mallopt) stay on libc.
rustix = { version = "1.1", features = ["fs", "net", "pipe", "process", "time"] }
futures-util = "0.3"
scrypt = { version = "0.11", features = ["simple"] }
rand = "0.10"
# Web Push: VAPID (ES256), RFC 8291 payload encryption, webhook HMAC.
ring = "0.17"
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["codec"] }
rml_rtmp = "0.8.0"
tokio-stream = "0.1"
rust-embed = "8"
rustls-pki-types = { version = "1", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies"] }
url = "2"
percent-encoding = "2"
# MoQ catalog `initData` (the AAC AudioSpecificConfig) is base64.
base64 = "0.23"
tracing = { version = "0.1", features = ["max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
# Paused-clock tests (`start_paused`, `time::advance`) only.
tokio = { version = "1.39", features = ["test-util"] }
criterion = "0.8"
http-body-util = "0.1"
proptest = "1"
loom = { version = "0.7", features = ["checkpoint"] }
# Generates the TypeScript contract of typed API payloads (test-only; the
# drift test in application::runtime_state compares the checked-in file).
ts-rs = "12"
restream-domain = { path = "crates/restream-domain", features = ["ts"] }
restream-engine = { path = "crates/restream-engine", features = ["test-support", "ts"] }
restream-health = { path = "crates/restream-health", features = ["ts"] }

[[bench]]
name = "api_health"
harness = false

[[bench]]
name = "alert_tracker"
harness = false

[profile.dev]
incremental = true
codegen-units = 16
debug = 1
# Avoid packaging DWARF into a single blob — unpacked is cheaper to write and
# the linker (mold) doesn't need to open it during linking.
split-debuginfo = "unpacked"

# Compile every dependency at opt-level 1 so they are fast to execute (and stay
# cached across rebuilds). Our own crate stays at opt-level 0 for maximum
# incremental compile speed — only changed translation units are recompiled.
[profile.dev.package."*"]
opt-level = 1

# Local benchmarks: fast incremental builds, debug symbols for flamegraphs.
# Accuracy is equivalent for relative comparisons; absolute ns values may
# differ ≤5% from full release.  CI uses --profile release for absolute numbers.
#
# Cargo hardcodes target/release as this profile's output dir for `bench`
# (dir-name cannot be overridden for the built-in profile names) and `cargo
# bench` on the `[[bench]]` entries below always resolves this profile by
# name — so it can't be renamed either. `cargo xtask build-bench` is
# the one canonical way to get bench-profile binaries into target/bench/;
# do not `cargo build --profile bench` directly and expect them there.
[profile.bench]
opt-level = 3
lto = "thin"
incremental = true
debug = 1
split-debuginfo = "unpacked"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 1
split-debuginfo = "unpacked"
panic = "unwind"

# Vendored with small hardening patches (see vendor/<crate>/RESTREAM_PATCHES.md).
[patch.crates-io]
hang = { path = "vendor/hang" }
moq-msf = { path = "vendor/moq-msf" }
rml_rtmp = { path = "vendor/rml_rtmp" }
# moq-net 0.3.15 plus the `unsend` feature (see vendor/moq-net/PATCH.md).
moq-net = { path = "vendor/moq-net" }
