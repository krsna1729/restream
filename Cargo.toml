[package]
name = "restream"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"
repository = "https://github.com/krsna1729/restream"

[workspace]
resolver = "3"
members = ["crates/xtask"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(fuzzing)', 'cfg(kani)'] }
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# The agent plane and its approval-gated execution back the control room's
# Change Studio, so every build carries them; `--no-default-features` removes
# them (the lower MCP layers are proven to compile without them).
default = ["agent-execution"]
agent-plane = []
agent-execution = ["agent-plane"]
mcp-core = []
mcp-server = ["mcp-core"]
mcp-http-backend = ["mcp-core"]
mcp-embedded = ["mcp-core", "agent-plane"]
egress-test-driver = []
# Harness-only Stage-B benchmark surface: enables the pinned srt-transport
# benchmark internals (`with_caller`, `bench_push_pending`, ...) so the substrate
# harness can drive the production Owner/TxEngine execution path with
# pre-materialized datagrams. Default-off: normal Restream builds must never see
# `bench-internals`.
wi3-owner-bench = ["srt-transport/bench-internals"]
# WI3.7-only shard-count seam. Kept default-off; production builds retain the
# CPU-derived SRT shard policy unless a benchmark explicitly opts in.
wi37-shard-bench = []

[dependencies]
httparse = "1.10"
tokio = { version = "1.39", features = [
    "fs", "io-util", "macros", "net", "process",
    "rt-multi-thread", "signal", "sync", "time", "test-util",
] }
axum = { version = "0.8", features = ["macros", "multipart"] }
# The dashboard listener serves axum on hyper directly to allow half-closed
# HTTP/1.1 requests (HLS push encoders close right after the body).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors", "set-header", "compression-gzip"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.12"
sysinfo = "0.39"
libc = "0.2"
futures-util = "0.3"
scrypt = { version = "0.11", features = ["simple"] }
rand = "0.10"
sha2 = "0.11"
md-5 = "0.11"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["codec"] }
rml_rtmp = "0.8.0"
arc-swap = "1"
memchr = "2.7"
tokio-stream = "0.1"
rust-embed = "8"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies"] }
url = "2"
percent-encoding = "2"
# MoQ catalog `initData` (the AAC AudioSpecificConfig) is base64.
base64 = "0.22"
# MoQ (moq-lite + hang, IETF MOQT drafts 14-22): the moq.dev drivers and media
# conventions, pinned; Restream supplies the Compio transport. `unsend` is the
# vendored patch (vendor/moq-net/PATCH.md) that lets the IETF entry points run
# over that `!Send` transport.
moq-net = { version = "=0.3.15", features = ["unsend"] }
hang = "=0.21.16"
# The poll transport traits moq-net 0.3.15 drives (`media::moq::transport`
# implements them over compio-quic), its waiter primitive, and the HTTP/3 +
# WebTransport framing for browser sessions; all pinned to moq-net's versions.
web-transport-trait = "=0.4.0"
kio = "=0.6.2"
web-transport-proto = "=0.6.2"
shiguredo_mp4 = "2026.5.0"
# srt-rs main 9b20d51 (PR #171: the poll-path duplicate keeps close-on-exec, so
# a Compio SRT Owner socket no longer leaks into every child process the engine
# spawns later; PR #164: discarded listener datagrams are charged to the visit
# budget; PR #162: a received DATA payload above the constant 1484-byte ceiling
# is dropped and counted rather than acted on, and the connection stays up;
# PRs #165-#170: the peer-group, CONCLUSION-admission, Backup retirement and
# re-eligibility, ACK-authority and payload-separation test suites; PR #160: the
# teardown-tail probe example; PR #161: the loss-bitmap word budget is declared
# and debug-asserted; PR #157: available parallelism is read once per
# process and explicit worker counts are used as given, so callers prepared
# on threads pinned apart still share one Owner; PR #156: per-source limits
# charge an IPv6 /64 and a
# mapped IPv4 as itself; PR #155: optional window-memory budget reserved at
# admission; PR #151: per-owner PBKDF2 key-derivation budget; PRs #145-#152:
# bounded per-visit work for delivery, periodic and peer NAKs, TLPKTDROP,
# cumulative ACK release and group member removal; PRs #142, #143, #149,
# #153, #154: bench, Kani, footprint, file-split and test-isolation work;
# PR #141: a reuseport group admits nothing until all K
# members are bound, one claim per member, one live layout per address, and
# no growth after start; PR #140: ingest-scaling bench on the production
# Owner; PR #139: the receiver skips its full TSBPD candidate
# scan while deadlines follow sequence order; PR #138: packets buffered when
# the TSBPD wrap period starts are no longer lost; PR #136: bonded legs
# relocate to the reuseport member holding their group, ListenerTransfer
# bridge between Owners; PR #135: `owner_plans` / `Owner::listen_planned` on
# every Owner; PR #134: multi-Owner listener layouts; PR #132: ACKACK history
# of 256 Full ACKs with at most two Full ACKs per ACK interval; PR #133:
# `Owner::set_tx_gso`; PR #131: cooperative taskrun, separate managed-RX
# buffer exhaustion counter; PR #128: GSO send coalescing, id hashing without
# SipHash, acked-bytes stats). SRT egress and ingress both run on
# `srt_transport::compio::Owner`; ingress attaches each `owner_plans` entry
# with `Owner::listen_planned`.
# PR #159: segmented receive payloads and explicit Owner-local retirement.
# Ingress consumes original chunks; both native Owners drive reclamation.
srt_proto = { package = "srt-proto", git = "https://github.com/krsna1729/srt-rs", rev = "9b20d515805aa2d920ffa2d84fd8061310779910" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "9b20d515805aa2d920ffa2d84fd8061310779910", features = ["compio"] }
# Bounded shard command channel with both blocking and Future-based receive, so
# a backend that owns a thread-affine completion runtime can await commands
# alongside its own I/O without a second wake source.
flume = { version = "0.12", default-features = false, features = ["async"] }
# The SRT egress backend owns one Compio runtime per shard thread, so it
# names the runtime type directly.
# The substrate benchmark harness compares Compio UDP submission with a direct
# io_uring baseline; production RTMP egress uses Compio TCP. MoQ (`quic`,
# with rustls `ring` crypto) runs native QUIC on its own Compio threads;
# `io-compat` gives its streams slice-based read/write.
compio = { version = "=0.19.2", default-features = false, features = ["runtime", "time", "net", "bytes", "quic", "ring", "io-compat"] }
io-uring = "0.7.15"
tracing = { version = "0.1", features = ["max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

[build-dependencies]
pkg-config = "0.3"
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
criterion = "0.8"
rtrb = "0.3"
crossbeam-queue = "0.3"
http-body-util = "0.1"
pulp = { version = "0.22", features = ["x86-v4"] }
wide = "1.5"
proptest = "1"
loom = { version = "0.7", features = ["checkpoint"] }
rcgen = "0.14.8"
# Generates the TypeScript contract of typed API payloads (test-only; the
# drift test in application::runtime_state compares the checked-in file).
ts-rs = "12"

[[bin]]
name = "restream-mcp"
path = "src/bin/restream-mcp.rs"
required-features = ["mcp-server", "mcp-http-backend"]

[[bench]]
name = "simd_alternatives"
harness = false

[[bench]]
name = "ring_buffer"
harness = false

[[bench]]
name = "ingest_handoff"
harness = false

[[bench]]
name = "api_health"
harness = false

[[bench]]
name = "avio_throughput"
harness = false

[[bench]]
name = "high_performance_data_path"
harness = false

[[bench]]
name = "hls_cost"
harness = false

[[bench]]
name = "hls_fmp4_cost"
harness = false

[[bench]]
name = "matrix_throughput"
harness = false

[[bench]]
name = "codec_conversions"
harness = false

[[bench]]
name = "moq_publish"
harness = false

[[bench]]
name = "rtmp_serializer"
harness = false

[[bench]]
name = "recirculation_cost"
harness = false

[[bench]]
name = "stage_metrics"
harness = false

[[bench]]
name = "alert_tracker"
harness = false

[[bench]]
name = "stage_feeder"
harness = false

[[bench]]
name = "input_gate"
harness = false

[[bench]]
name = "egress_visit"
harness = false
required-features = ["egress-test-driver"]

[profile.dev]
incremental = true
codegen-units = 16
debug = 1
# Avoid packaging DWARF into a single blob — unpacked is cheaper to write and
# the linker (mold) doesn't need to open it during linking.
split-debuginfo = "unpacked"

# Compile every dependency at opt-level 1 so they are fast to execute (and stay
# cached across rebuilds). Our own crate stays at opt-level 0 for maximum
# incremental compile speed — only changed translation units are recompiled.
[profile.dev.package."*"]
opt-level = 1

# Local benchmarks: fast incremental builds, debug symbols for flamegraphs.
# Accuracy is equivalent for relative comparisons; absolute ns values may
# differ ≤5% from full release.  CI uses --profile release for absolute numbers.
#
# Cargo hardcodes target/release as this profile's output dir for `bench`
# (dir-name cannot be overridden for the built-in profile names) and `cargo
# bench` on the `[[bench]]` entries below always resolves this profile by
# name — so it can't be renamed either. `cargo xtask build-bench` is
# the one canonical way to get bench-profile binaries into target/bench/;
# do not `cargo build --profile bench` directly and expect them there.
[profile.bench]
opt-level = 3
lto = "thin"
incremental = true
debug = 1
split-debuginfo = "unpacked"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 1
split-debuginfo = "unpacked"
panic = "unwind"

# Vendored with small hardening patches (see vendor/<crate>/RESTREAM_PATCHES.md).
[patch.crates-io]
hang = { path = "vendor/hang" }
rml_rtmp = { path = "vendor/rml_rtmp" }
# moq-net 0.3.15 plus the `unsend` feature (see vendor/moq-net/PATCH.md).
moq-net = { path = "vendor/moq-net" }
