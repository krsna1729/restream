[package]
name = "restream"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT"
repository = "https://github.com/krsna1729/restream"

[workspace]
resolver = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
agent-plane = []
agent-execution = ["agent-plane"]
mcp-core = []
mcp-server = ["mcp-core"]
mcp-http-backend = ["mcp-core"]
mcp-embedded = ["mcp-core", "agent-plane"]
egress-test-driver = []
# Harness-only Stage-B benchmark surface: enables the pinned srt-transport
# benchmark internals (`with_caller`, `bench_push_pending`, ...) so the substrate
# harness can drive the production Owner/TxEngine execution path with
# pre-materialized datagrams. Default-off: normal Restream builds must never see
# `bench-internals`.
wi3-owner-bench = ["srt-transport/bench-internals"]
# WI3.7-only shard-count seam. Kept default-off; production builds retain the
# CPU-derived SRT shard policy unless a benchmark explicitly opts in.
wi37-shard-bench = []

[dependencies]
tokio = { version = "1.35", features = [
    "fs", "io-util", "macros", "net", "process",
    "rt-multi-thread", "signal", "sync", "time", "test-util",
] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.7", features = ["fs", "cors", "set-header", "compression-gzip"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.12"
sysinfo = "0.39"
libc = "0.2"
futures-util = "0.3"
scrypt = { version = "0.11", features = ["simple"] }
rand = "0.10"
sha2 = "0.11"
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["codec"] }
rml_rtmp = "0.8.0"
arc-swap = "1"
memchr = "2.7"
tokio-stream = "0.1"
rust-embed = "8"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
percent-encoding = "2"
shiguredo_mp4 = "2026.5.0"
# Upstream srt-rs (merged main). SRT egress and ingress both run on
# `srt_transport::compio::Owner`; ingress attaches with
# `Owner::listen_with_resolver`.
srt_proto = { package = "srt-proto", git = "https://github.com/krsna1729/srt-rs", rev = "86369b0815c09333547c965652250e17f580e834" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "86369b0815c09333547c965652250e17f580e834", features = ["compio"] }
# Bounded shard command channel with both blocking and Future-based receive, so
# a backend that owns a thread-affine completion runtime can await commands
# alongside its own I/O without a second wake source.
flume = { version = "0.12", default-features = false, features = ["async"] }
# The SRT egress backend owns one Compio runtime per shard thread, so it
# names the runtime type directly.
# The substrate benchmark harness compares Compio UDP submission with a direct
# io_uring baseline; production RTMP egress uses Compio TCP.
compio = { version = "=0.19.2", default-features = false, features = ["runtime", "time", "net"] }
io-uring = "0.7.15"
tracing = { version = "0.1", features = ["max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

[build-dependencies]
pkg-config = "0.3"
serde_json = "1.0"
sha2 = "0.11"

[dev-dependencies]
criterion = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
pulp = { version = "0.22", features = ["x86-v4"] }
wide = "1.5"
proptest = "1"
loom = { version = "0.7", features = ["checkpoint"] }
rcgen = "0.14.8"

[[bin]]
name = "restream-mcp"
path = "src/bin/restream-mcp.rs"
required-features = ["mcp-server", "mcp-http-backend"]

[[bench]]
name = "simd_alternatives"
harness = false

[[bench]]
name = "ring_buffer"
harness = false

[[bench]]
name = "transcoder_throughput"
harness = false

[[bench]]
name = "avio_throughput"
harness = false

[[bench]]
name = "high_performance_data_path"
harness = false

[[bench]]
name = "hls_cost"
harness = false

[[bench]]
name = "hls_fmp4_cost"
harness = false

[[bench]]
name = "matrix_throughput"
harness = false

[[bench]]
name = "codec_conversions"
harness = false

[[bench]]
name = "rtmp_serializer"
harness = false

[[bench]]
name = "recirculation_cost"
harness = false

[[bench]]
name = "stage_metrics"
harness = false

[[bench]]
name = "alert_tracker"
harness = false

[[bench]]
name = "stage_feeder"
harness = false

[[bench]]
name = "input_gate"
harness = false

[profile.dev]
incremental = true
codegen-units = 16
debug = 1
# Avoid packaging DWARF into a single blob — unpacked is cheaper to write and
# the linker (mold) doesn't need to open it during linking.
split-debuginfo = "unpacked"

# Compile every dependency at opt-level 1 so they are fast to execute (and stay
# cached across rebuilds). Our own crate stays at opt-level 0 for maximum
# incremental compile speed — only changed translation units are recompiled.
[profile.dev.package."*"]
opt-level = 1

# Local benchmarks: fast incremental builds, debug symbols for flamegraphs.
# Accuracy is equivalent for relative comparisons; absolute ns values may
# differ ≤5% from full release.  CI uses --profile release for absolute numbers.
#
# Cargo hardcodes target/release as this profile's output dir for `bench`
# (dir-name cannot be overridden for the built-in profile names) and `cargo
# bench` on the `[[bench]]` entries below always resolves this profile by
# name — so it can't be renamed either. `scripts/build/bench-harness.sh` is
# the one canonical way to get bench-profile binaries into target/bench/;
# do not `cargo build --profile bench` directly and expect them there.
[profile.bench]
opt-level = 3
lto = "thin"
incremental = true
debug = 1
split-debuginfo = "unpacked"
codegen-units = 16

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 1
split-debuginfo = "unpacked"
panic = "unwind"

# Vendored with a small memory-hardening patch (see vendor/rml_rtmp/RESTREAM_PATCHES.md).
[patch.crates-io]
rml_rtmp = { path = "vendor/rml_rtmp" }
