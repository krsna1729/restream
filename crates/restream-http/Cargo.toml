[package]
name = "restream-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
# `rustls-no-provider`: reqwest's own rustls setup would need a process-default
# crypto provider (`rustls` brings aws-lc-rs instead). Every client here gets a
# finished rustls config, so neither is used (see src/lib.rs).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
webpki-roots = "1.0"

[dev-dependencies]
rcgen = "0.14.8"
tokio = { version = "1.39", features = ["io-util", "macros", "net", "rt"] }
