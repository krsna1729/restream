[package]
name = "test_harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[[bin]]
name = "test_harness"
path = "src/main.rs"

[dependencies]
restream = { path = "../.." }
restream-domain = { path = "../restream-domain" }
restream-sync = { path = "../restream-sync" }
axum = { version = "0.8", features = ["macros"] }
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
rml_rtmp = "0.8.0"
serde = { version = "1.0", features = ["derive"] }
srt-proto = { git = "https://github.com/krsna1729/srt-rs", rev = "2119264553eab8ccb4c2dfbb56214fbe2333971d" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "2119264553eab8ccb4c2dfbb56214fbe2333971d", features = ["compio"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full", "test-util"] }
rcgen = "0.14.8"
futures-util = "0.3"
rand = "0.10"
libc = "0.2"
url = "2"
percent-encoding = "2"
rtrb = "0.4"
sha2 = "0.11"
base64 = "0.22"
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
tracing = "0.1"
compio = { version = "0.19", default-features = false, features = ["runtime", "time", "net", "bytes", "quic", "io-compat"] }
moq-msf = "0.5"
flume = { version = "0.12", default-features = false, features = ["async"] }
hang = "=0.21.16"
moq-net = { version = "=0.3.15", features = ["unsend"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[dev-dependencies]
proptest = "1"
