[package]
name = "restream-srt"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
restream-sync = { path = "../restream-sync" }
bytes = "1.12"
srt_proto = { package = "srt-proto", git = "https://github.com/krsna1729/srt-rs", rev = "91eeef82a2c0dd0e3f1263ab0a8e062af572d8d2" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "91eeef82a2c0dd0e3f1263ab0a8e062af572d8d2", features = ["compio"] }
percent-encoding = "2"
