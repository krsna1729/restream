[package]
name = "restream-srt"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
restream-core = { path = "../restream-core" }
restream-sync = { path = "../restream-sync" }
bytes = "1.12"
srt_proto = { package = "srt-proto", git = "https://github.com/krsna1729/srt-rs", rev = "2119264553eab8ccb4c2dfbb56214fbe2333971d" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "2119264553eab8ccb4c2dfbb56214fbe2333971d", features = ["compio"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
percent-encoding = "2"
