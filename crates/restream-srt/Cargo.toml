[package]
name = "restream-srt"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
restream-sync = { path = "../restream-sync" }
bytes = "1.12"
srt_proto = { package = "srt-proto", git = "https://github.com/krsna1729/srt-rs", rev = "4dad48521ee8f69c44b3845953bc2b4a478666c6" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "4dad48521ee8f69c44b3845953bc2b4a478666c6", features = ["compio"] }
percent-encoding = "2"
