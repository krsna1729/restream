[package]
name = "restream-srt"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
restream-sync = { path = "../restream-sync" }
bytes = "1.12"
srt_proto = { package = "srt-proto", git = "https://github.com/krsna1729/srt-rs", rev = "a7eec99758904ba756b3385e13e0b2be2d6c4f40" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "a7eec99758904ba756b3385e13e0b2be2d6c4f40", features = ["compio"] }
percent-encoding = "2"
