[package]
name = "restream-srt"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
restream-sync = { path = "../restream-sync" }
bytes = "1.12"
srt_proto = { package = "srt-proto", git = "https://github.com/krsna1729/srt-rs", rev = "ba833dd6b6521506e33b17075963a6103997e4c0" }
srt-transport = { git = "https://github.com/krsna1729/srt-rs", rev = "ba833dd6b6521506e33b17075963a6103997e4c0", features = ["compio"] }
percent-encoding = "2"
