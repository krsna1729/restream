[package]
name = "restream-agent-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[features]
# Lists the execution tools as compiled in (`agent_tool_names`). The product's
# `agent-execution` feature enables it.
agent-execution = []

[dependencies]
restream-domain = { path = "../restream-domain" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
