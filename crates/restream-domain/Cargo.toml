[package]
name = "restream-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[lints]
workspace = true

[features]
# TypeScript declarations for the dashboard drift test (`ts_rs::TS` derives).
ts = ["dep:ts-rs"]

[dependencies]
restream-core = { path = "../restream-core" }
serde = { version = "1.0", features = ["derive"] }
url = "2"
ts-rs = { version = "12", optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1.0"
