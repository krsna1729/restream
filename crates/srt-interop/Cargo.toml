[package]
name = "srt-interop"
version = "0.0.0"
edition = "2024"
publish = false
description = "Standalone caller/listener binaries over srt-protocol + std, for interop tests without linking restream or libsrt. See docs/srt-pure-rust-plan.md."

[dependencies]
shiguredo_srt = { path = "../srt-protocol" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# cpu_stats.rs: framework-agnostic CPU accounting via getrusage(), shared by
# every loss-caller/loss-listener backend below.
libc = "0.2"

# --- Driver framework bake-off (docs/srt-pure-rust-plan.md Phase 4) ---
# Six backends for the sustained-throughput loss-caller/loss-listener
# binaries, sharing an external CLI/STATS-line contract (same args, same
# output schema -- see mio_driver.rs's doc comment) but each free to use its
# own idiomatic high-performance I/O primitives internally. A single Rust
# trait spanning readiness-based (mio/smol), task-based (tokio/smol), and
# completion-based (monoio/glommio/compio) execution models would force a
# lowest-common-denominator API that defeats the point of comparing them on
# their own terms -- "swappable" here means swappable via binary/CLI
# selection (the orchestration script's IMPLS values), not a shared trait
# object.
mio = { version = "1", features = ["os-poll", "net"] }
tokio = { version = "1", features = ["net", "time", "rt", "rt-multi-thread", "macros"] }
smol = "2"
futures-lite = "2"
monoio = { version = "0.2", features = ["sync"] }
# Linux-only, requires a modern io_uring-capable kernel -- guarded with
# #[cfg(target_os = "linux")] in glommio_*.rs's main(), see there.
glommio = "0.9"
compio = { version = "0.19", features = ["io", "io-uring", "net", "runtime", "time", "macros"] }

[[bin]]
name = "srt-interop-caller"
path = "src/bin/caller.rs"

[[bin]]
name = "srt-interop-listener"
path = "src/bin/listener.rs"

[[bin]]
name = "srt-interop-loss-caller-mio"
path = "src/bin/loss_caller_mio.rs"

[[bin]]
name = "srt-interop-loss-listener-mio"
path = "src/bin/loss_listener_mio.rs"

[[bin]]
name = "srt-interop-loss-caller-tokio"
path = "src/bin/loss_caller_tokio.rs"

[[bin]]
name = "srt-interop-loss-listener-tokio"
path = "src/bin/loss_listener_tokio.rs"

[[bin]]
name = "srt-interop-loss-caller-smol"
path = "src/bin/loss_caller_smol.rs"

[[bin]]
name = "srt-interop-loss-listener-smol"
path = "src/bin/loss_listener_smol.rs"

[[bin]]
name = "srt-interop-loss-caller-monoio"
path = "src/bin/loss_caller_monoio.rs"

[[bin]]
name = "srt-interop-loss-listener-monoio"
path = "src/bin/loss_listener_monoio.rs"

[[bin]]
name = "srt-interop-loss-caller-glommio"
path = "src/bin/loss_caller_glommio.rs"

[[bin]]
name = "srt-interop-loss-listener-glommio"
path = "src/bin/loss_listener_glommio.rs"

[[bin]]
name = "srt-interop-loss-caller-compio"
path = "src/bin/loss_caller_compio.rs"

[[bin]]
name = "srt-interop-loss-listener-compio"
path = "src/bin/loss_listener_compio.rs"
