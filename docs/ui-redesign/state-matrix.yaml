version: 1
purpose: framework-neutral operator UI redesign baseline
fixture_policy:
  secrets: use obvious fake values and .invalid hosts only
  media: use test/fixtures/media-library/colorbar-timer-2v16a.mp4
  screenshots: capture only deterministic synthetic states

states:
  - id: fleet.empty
    surface: overview
    fixture: empty
    expected: No pipelines configured is visible with a reachable add action.
    proof:
      status: seeded
      files:
        - test/frontend/redesign/seed.spec.ts

  - id: fleet.mixed-health
    surface: overview
    fixture: mixed-health
    expected: Healthy and retrying pipelines remain distinguishable.
    proof:
      status: seeded
      files:
        - test/frontend/redesign/seed.spec.ts

  - id: chaos.recovery-truth
    surface: pipeline-operate
    fixture: chaos-recovery
    expected: Reconnecting inputs, HLS retry timeouts, recovered-but-flapping outputs, stalled sinks among healthy siblings, and retry-budget-exhausted terminal failures stay distinguishable without opening raw logs.
    proof:
      status: seeded
      source: .local/artifacts/latest/recovery/recovery.json, .local/artifacts/latest/fault.output-stall/fault.output-stall.json, and .local/artifacts/latest/fault.egress-retry/fault.egress-retry.json from test_harness on 2026-07-16
      files:
        - test/frontend/redesign/fixtures/operator-states.ts
        - test/frontend/redesign/seed.spec.ts

  - id: msr.live-pressure
    surface: overview-and-pipeline-operate
    fixture: live-msr
    expected: 120 live outputs, 30 audio tracks, long pipeline lists, and the MSR output list remain navigable through bounded defaults, search/filter, and progressive disclosure.
    proof:
      status: live
      source: .local/artifacts/latest/msr.json and .local/artifacts/ui-v2-live-msr/crawl-results.json from test_harness msr on 2026-07-16; seeded Playwright/CDP proves Overview pipeline search counts plus local active/no-hit clear-search recovery, Overview activity burst search counts plus local active/no-hit clear-search recovery, v2 pipeline-selector search counts plus local active/no-hit clear-search recovery, Operate output and rail filter result counts plus local active/no-hit clear-filter recovery, Operate audio-track search counts plus local no-hit clear-search recovery for 30-track inputs, Inspect scope/input/output/attention counts plus diagnostics focus guidance and output-preview search counts with local active/no-hit clear-search recovery, Monitor scope, search match counts, and local clear-search recovery, Media search result counts split by Recordings and Source Files plus local clear-search recovery, Settings section/profile/security-attempt counts, auth-attempt search result counts, and local clear-search recovery, Status process/activity search counts and local clear-search recovery, Incidents scoped alert/event counts, cross-feed search result counts, and local clear-search recovery, Telemetry scoped engine/pipeline counts, reader/stage/egress filter counts plus local clear-search recovery, and stage-card progressive disclosure, primary workspace navigation exposes Incidents and Telemetry, workspace and pipeline tablists support Arrow/Home/End navigation and keep the active tab visible on narrow rails without page-wide overflow, a legacy-owned route-checkpoint matrix with route-specific CDP node budgets, workspace ownership cues for v2-owned versus legacy-checkpoint routes, and no-result guidance are announced as status text without mislabeling filtered monitor cards as missing configuration, and v2 input ownership empties hidden legacy audio/preview hosts
      files:
        - docs/ui-redesign/operator-msr-live-review-2026-07-16.md
        - test/frontend/redesign/seed.spec.ts

  - id: output.starting-stopping
    surface: pipeline-operate
    expected: Pending intent remains visible until lifecycle or fallback convergence.
    proof:
      status: existing
      files:
        - test/frontend/dashboard-contract/output-mutations.test.mjs
        - test/frontend/frontend-output-scenarios.test.mjs

  - id: output.retrying-unexpected-down
    surface: pipeline-operate
    expected: Retry, flapping, failed, and intentionally stopped states differ.
    proof:
      status: existing
      files:
        - test/frontend/frontend-output-scenarios.test.mjs
        - test/frontend/frontend-core-helpers.test.mjs

  - id: recording.lifecycle
    surface: pipeline-operate
    expected: Starting, active, and stopping preserve intent and runtime state.
    proof:
      status: seeded
      source: Playwright seeded v2 flow covers slow pending controls, failed recording context, retry-ready controls, and CDP node budget
      files:
        - test/frontend/dashboard-contract/pipeline-mutations.test.mjs
        - test/frontend/redesign/seed.spec.ts

  - id: file-ingest.lifecycle
    surface: pipeline-operate
    expected: Starting, active, failed, and stopping states are operator-visible.
    proof:
      status: seeded
      source: Playwright seeded v2 flow covers slow pending controls, failed file-ingest context, retry-ready controls, and CDP node budget
      files:
        - test/frontend/dashboard-contract/pipeline-mutations.test.mjs
        - test/frontend/frontend-pipeline-info-scenarios.test.mjs
        - test/frontend/redesign/seed.spec.ts

  - id: runtime.sse-reconnect
    surface: shared-runtime
    expected: Reconnect resumes after the last event without duplicate activity.
    proof:
      status: existing
      files:
        - test/frontend/frontend-log-stream.test.mjs
        - test/frontend/frontend-history-stream.test.mjs
        - test/frontend/frontend-status-stream.test.mjs

  - id: runtime.hidden-resume
    surface: shared-runtime
    expected: Hidden polling is slower and visibility resume forces reconciliation.
    proof:
      status: existing
      files:
        - test/frontend/dashboard-contract/runtime-polling.test.mjs
        - test/frontend/frontend-overview-activity-stream.test.mjs

  - id: runtime.stale-snapshot
    surface: overview
    expected: Stale async results cannot replace the current selection or scope.
    proof:
      status: existing
      files:
        - test/frontend/frontend-incidents.test.mjs
        - test/frontend/frontend-engineer-telemetry.test.mjs

  - id: runtime.selected-pipeline-convergence
    surface: pipeline-operate
    expected: When the focused pipeline runtime details have not converged yet, v2 shows an explicit lightweight placeholder instead of a silent partial shell.
    proof:
      status: seeded
      source: Playwright render proof with CDP Performance.getMetrics node budget
      files:
        - test/frontend/redesign/seed.spec.ts

  - id: hls.unavailable
    surface: pipeline-operate
    expected: Unsupported, unavailable, timeout, and playback failures differ.
    proof:
      status: existing
      files:
        - test/frontend/hls-player.spec.ts

  - id: hls.audio-1-and-16
    surface: pipeline-operate
    expected: Single and sixteen-track inputs remain selectable and labeled.
    proof:
      status: existing
      files:
        - test/frontend/hls-player.spec.ts

  - id: auth.expired
    surface: shared-runtime
    expected: A 401 returns the operator to the base-path-aware login flow.
    proof:
      status: seeded
      source: Playwright seeded v2 flow proves a runtime 401 redirects to login with the full operator return path, browser DOM coverage proves successful login returns to that preserved location, and seeded Playwright/CDP proves the legacy-owned Status route announces its loaded build and process-activity summary as status text while separately announcing process-log/activity search hit and no-hit counts.
      files:
        - test/frontend/frontend-browser-dom.spec.ts
        - test/frontend/redesign/seed.spec.ts

  - id: mutation.slow-failed
    surface: pipeline-operate
    expected: Slow and failed mutations retain context and prevent duplicate action.
    proof:
      status: seeded
      source: Playwright seeded v2 flows cover recording, file-ingest, and output pending/failure context with CDP node budgets
      files:
        - test/frontend/dashboard-contract/output-mutations.test.mjs
        - test/frontend/redesign/seed.spec.ts

  - id: viewport.mobile-tablet-desktop
    surface: all
    expected: Primary tasks remain usable without overflow at fixed viewports.
    proof:
      status: existing
      files:
        - test/frontend/redesign/visual-accessibility.spec.ts
        - test/frontend/redesign/playwright.visual.config.ts
        - test/frontend/redesign/snapshots/

  - id: accessibility.keyboard-aria-contrast
    surface: all
    expected: Primary tasks work by keyboard with stable names, focus, and contrast.
    proof:
      status: partial
      source: Playwright/CDP proves v2 Overview and Operate primary routes stay keyboard-reachable, expose a skip link into the active main tabpanel before dense chrome, keep bounded node counts, use one canonical history step from Overview into selected Pipeline Operate or Inspect, preserve the selected pipeline while moving Operate to Inspect to Monitor without duplicate active-tab history pushes, keep v2 Operate inside the viewport across desktop/tablet/mobile breakpoints, keep active workspace and pipeline tabs visible on narrow rails, expose named controls and landmarks in the accessibility tree, pass serious/critical axe checks on v2 Operate, and keep output action menus menu/menuitem-accessible with Escape focus restoration
      files:
        - test/frontend/frontend-dom-invariants.test.mjs
        - test/frontend/frontend-browser-dom.spec.ts
        - test/frontend/redesign/visual-accessibility.spec.ts
        - test/frontend/redesign/seed.spec.ts
        - test/frontend/redesign/snapshots/
      gap: Retain manual browser text-zoom and assistive-technology review beyond seeded Overview and v2 Operate automated accessibility paths.
