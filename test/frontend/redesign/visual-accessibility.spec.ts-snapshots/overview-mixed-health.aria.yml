- tabpanel "Overview":
  - paragraph: Live operations
  - heading "Fleet overview" [level=1]
  - paragraph: See what needs action before scanning throughput and system load.
  - button "Add a new pipeline": Add Pipeline
  - region "1 pipeline needs attention":
    - paragraph: Current priority
    - heading "1 pipeline needs attention" [level=2]
    - paragraph: Issues are ordered by upstream cause and severity.
    - button "Open restream runtime detail"
    - article:
      - heading "Retrying Destination" [level=3]
      - paragraph: 1 retrying
      - text: Output retrying recovering
      - button "Operate Retrying Destination"
      - button "Inspect Retrying Destination"
  - region "Fleet signals":
    - heading "Fleet signals" [level=2]
    - paragraph: Current snapshot and recent trend
    - text: /2 pipelines Inputs live 2\/2 All quiet Outputs running 1\/2 1 retrying Inbound 5\.6 Mb\/s Active publishers Outbound 2\.9 Mb\/s 0 recordings Engine CPU 7\.0% Restream 5\.0% \/ FFmpeg 2\.0% \(1\) Engine memory \d+\.\d+ MiB Restream \d+\.\d+ MiB \/ FFmpeg \d+\.\d+ MiB/
  - region "All pipelines":
    - heading "All pipelines" [level=2]
    - paragraph: Compare intent, runtime state, and data flow.
    - table:
      - rowgroup:
        - row "Pipeline State Input Outputs Input Rate Output Rate Recording":
          - columnheader "Pipeline"
          - columnheader "State"
          - columnheader "Input"
          - columnheader "Outputs"
          - columnheader "Input Rate"
          - columnheader "Output Rate"
          - columnheader "Recording"
      - rowgroup:
        - row "Open pipeline Healthy Program Live healthy Live input 3.2 Mb/s 1/1 running 3.2 Mb/s 2.9 Mb/s Off":
          - cell "Open pipeline Healthy Program":
            - button "Open pipeline Healthy Program"
          - cell "Live healthy"
          - cell "Live input 3.2 Mb/s"
          - cell "1/1 running"
          - cell "3.2 Mb/s"
          - cell "2.9 Mb/s"
          - cell "Off"
        - row "Open pipeline Retrying Destination Output retrying recovering Live input 2.4 Mb/s 1 retrying 0/1 running 2.4 Mb/s -- Armed ready":
          - cell "Open pipeline Retrying Destination":
            - button "Open pipeline Retrying Destination"
          - cell "Output retrying recovering"
          - cell "Live input 2.4 Mb/s"
          - cell "1 retrying 0/1 running"
          - cell "2.4 Mb/s"
          - cell "--"
          - cell "Armed ready"
  - region "Restream Activity":
    - heading "Restream Activity" [level=2]
    - paragraph: Recent restream-wide event bursts, grouped for operator-friendly review.
    - button "Open restream status": Open Status
    - article:
      - heading "Restream warning burst" [level=3]
      - paragraph: Warnings or errors were recorded close together at restream scope.
      - paragraph: 1 log reviewed
      - text: /\d+:\d+ AM 1 event/