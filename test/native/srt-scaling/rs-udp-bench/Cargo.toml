[package]
name = "rs-udp-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone prototype, deliberately NOT a member of the root workspace:
# this is throwaway measurement tooling (the Rust equivalent of
# test/native/srt-scaling/{udp_sender,udp_sink}.c), not production code.
# See README.md.

[[bin]]
name = "udp_sender_rs"
path = "src/bin/udp_sender.rs"

[[bin]]
name = "udp_sink_rs"
path = "src/bin/udp_sink.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
