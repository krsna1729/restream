[alias]
xtask = "run --quiet --package xtask --"

# Leave one CPU free so builds don't starve the desktop or a live run.
# Override with: CARGO_BUILD_JOBS=N cargo build
[build]
jobs = -1

# mold is ~10× faster than ld for linking. All profiles benefit.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "link-arg=-Wl,-z,relro,-z,now"]

