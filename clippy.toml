disallowed-methods = [
  { path = "std::sync::Mutex::lock", reason = "use restream_sync::lock::lock: a poisoned lock must not panic every later reader" },
  { path = "std::sync::RwLock::read", reason = "use restream_sync::lock::read (poison-tolerant)" },
  { path = "std::sync::RwLock::write", reason = "use restream_sync::lock::write (poison-tolerant)" },
  { path = "sqlx::Row::get", reason = "use Row::try_get with ?: a NULL or mistyped column (SQLite stores any type) must be an error, not a panic" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "blocking getaddrinfo with no deadline: resolve through restream_engine::resolver (Resolver::resolve / Resolver::submit)" },
  { path = "tokio::net::lookup_host", reason = "no deadline, and each hung call holds a blocking-pool thread: resolve through restream_engine::resolver (Resolver::resolve)" },
  { path = "tokio::process::Child::wait", reason = "unbounded: await a child through restream_engine::child_process::reap (grace, then SIGKILL)" },
  { path = "tokio::process::Child::wait_with_output", reason = "unbounded: run a tool to completion through restream_engine::ffmpeg_binary::run_tool (bounded, killed past it)" },
  { path = "tokio::process::Command::output", reason = "unbounded: run a tool to completion through restream_engine::ffmpeg_binary::run_tool (bounded, killed past it)" },
  { path = "reqwest::Client::new", reason = "reqwest's own rustls setup panics without a process-default crypto provider and trusts the platform store: build through restream_http::client (ring, webpki-roots)" },
  { path = "reqwest::Client::builder", reason = "reqwest's own rustls setup panics without a process-default crypto provider and trusts the platform store: build through restream_http::client_builder (ring, webpki-roots)" },
  { path = "reqwest::ClientBuilder::new", reason = "reqwest's own rustls setup panics without a process-default crypto provider: build through restream_http::client_builder" },
  { path = "reqwest::get", reason = "builds a reqwest::Client::new: send through a restream_http::client" },
  { path = "reqwest::ClientBuilder::tls_backend_rustls", reason = "brings back reqwest's own rustls setup (panics without a process-default crypto provider)" },
  { path = "reqwest::ClientBuilder::use_rustls_tls", reason = "brings back reqwest's own rustls setup (panics without a process-default crypto provider)" },
  { path = "reqwest::ClientBuilder::add_root_certificate", reason = "ignored by restream_http's preconfigured TLS: use restream_http::client_builder_with_pem_roots" },
  { path = "reqwest::ClientBuilder::tls_certs_merge", reason = "ignored by restream_http's preconfigured TLS: use restream_http::client_builder_with_pem_roots" },
  { path = "reqwest::ClientBuilder::tls_certs_only", reason = "ignored by restream_http's preconfigured TLS: use restream_http::client_builder_with_tls" },
]
# `clippy::await_holding_invalid_type`: a tokio guard held across an await
# (another lock's acquisition included) is how a registry read re-acquired
# behind a queued writer, or two locks taken in opposite orders, deadlock the
# control plane. Copy into owned data and release first; a section that must
# hold more than one guard carries `#[expect(..., reason = "lock order ...")]`
# in the order documented in `crates/restream-engine/src/engine_registries.rs`.
await-holding-invalid-types = [
  { path = "tokio::sync::RwLockReadGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::RwLockWriteGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::RwLockMappedWriteGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::MutexGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::MappedMutexGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::OwnedRwLockReadGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::OwnedRwLockWriteGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::OwnedMutexGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::OwnedRwLockMappedWriteGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "tokio::sync::OwnedMappedMutexGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
  { path = "restream_sync::keyed_lock::KeyedGuard", reason = "release the guard before the next await (lock order: engine_registries.rs)" },
]
# `clippy::too_many_lines` (enabled in `[workspace.lints.clippy]`): the unit
# too big to review is a function, not a file. Counts code lines only. A
# pre-existing offender carries `#[expect(clippy::too_many_lines, reason)]`;
# delete it when the function is split.
too-many-lines-threshold = 150
